<style>
:root{
  --bg:#f7ecd9; --bg-2:#f2e2c8; --surface:#fdf7ec; --surface-2:#ebddc5; --text:#201e1d;
  --accent:#c67139; --accent-100:#fff2eb; --accent-200:#ffe1d0; --accent-300:#ffc6a5;
  --accent-500:#c67139; --accent-600:#b2622d; --accent-700:#8c491a; --accent-800:#643312; --accent-900:#402310;
  --sage-100:#f0fae1; --sage-200:#e1eecc; --sage-300:#ccdbb2; --sage-500:#7a8a5e; --sage-600:#728157; --sage-700:#56633f; --sage-800:#3d472b;
  --n-100:#f9f4ed; --n-200:#eee7db; --n-300:#dcd3c4; --n-400:#c0b6a5; --n-600:#82796a; --n-700:#645c50; --n-800:#474238;
  --divider:rgba(32,30,29,.14);
  --shadow-sm:0 1px 2px rgba(46,43,37,.14); --shadow-md:0 4px 14px rgba(46,43,37,.14); --shadow-lg:0 14px 36px rgba(46,43,37,.22);
  --font-h:"Caprasimo",Georgia,serif; --font-b:"Figtree",system-ui,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  background:
    radial-gradient(120% 62% at 88% -8%,rgba(198,113,57,.20),transparent 62%),
    radial-gradient(110% 54% at 4% 4%,rgba(122,138,94,.18),transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:400;line-height:1.1;letter-spacing:-.015em;margin:0 0 8px}
h2{font-size:30px} h3{font-size:23px} h4{font-size:19px}
p{margin:0 0 12px}
a{color:var(--accent-700)} a:hover{color:var(--accent-800)}
button,input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(198,113,57,.3)}
.hide{display:none!important}

#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
header.top{padding:calc(var(--safe-top) + 14px) 18px 8px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--font-h);font-size:24px;line-height:1;display:flex;align-items:center;gap:9px}
.brand i{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:#fff2eb;
  background:linear-gradient(160deg,#d9853f,#8c491a);box-shadow:0 3px 0 var(--accent-900),inset 0 1px 0 rgba(255,255,255,.35)}
.kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-700);font-weight:700}
main{flex:1;overflow-y:auto;padding:0 18px calc(112px + var(--safe-bot));-webkit-overflow-scrolling:touch}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:2px;padding:8px 10px calc(10px + var(--safe-bot));
  max-width:520px;margin:0 auto;
  background:linear-gradient(to top,var(--bg-2) 62%,rgba(242,226,200,0))}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0;color:var(--n-600);cursor:pointer;min-height:52px}
nav.tabs button[aria-current="page"]{color:var(--accent-800)}
nav.tabs button[aria-current="page"] .tico{color:#fff2eb;background:linear-gradient(160deg,#d9853f,#a4551f);box-shadow:0 3px 0 var(--accent-900)}
.tico{width:40px;height:27px;border-radius:11px;display:grid;place-items:center;background:transparent}
nav.tabs span{font-size:9.5px;letter-spacing:.04em;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;
  font-family:var(--font-h);font-size:14px;line-height:1.2;color:var(--text);background:transparent;
  border:1px solid transparent;padding:11px 16px;border-radius:999px;min-height:44px}
.btn-primary{background:linear-gradient(160deg,#d9853f,#b2622d);color:#fff6ee;box-shadow:0 4px 0 var(--accent-800)}
.btn-primary:active{box-shadow:0 1px 0 var(--accent-900);transform:translateY(3px)}
.btn-sage{background:linear-gradient(160deg,#8b9c68,#56633f);color:var(--sage-100);box-shadow:0 4px 0 var(--sage-800)}
.btn-sage:active{box-shadow:0 1px 0 var(--sage-800);transform:translateY(3px)}
.btn-secondary{border-color:var(--divider);background:var(--surface)}
.btn-secondary:active{background:var(--n-200)}
.btn-ghost{color:var(--accent-700);padding:8px 10px;min-height:40px}
.btn-block{width:100%}
.btn:disabled{opacity:.45}
.icon-btn{width:44px;height:44px;padding:0;border-radius:14px;background:var(--surface);border:1px solid var(--divider);
  display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm)}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--n-200);color:var(--n-800)}
.tag-accent{background:var(--accent-100);color:var(--accent-800)}
.tag-sage{background:var(--sage-100);color:var(--sage-800)}
.tag-plat{font-family:var(--font-h);font-size:10.5px;padding:3px 9px}
.card{background:var(--surface);border-radius:24px;padding:15px;box-shadow:var(--shadow-sm)}
.cab{border-radius:28px;padding:17px;position:relative;overflow:hidden;color:var(--accent-100);
  background:linear-gradient(155deg,#5a3216 0%,#402310 52%,#2b1a11 100%);
  box-shadow:0 8px 0 rgba(43,26,17,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.cab .kicker{color:var(--accent-300)}
.cab-sage{background:linear-gradient(155deg,#5c6b44 0%,#3d472b 55%,#2a3120 100%);color:var(--sage-100);
  box-shadow:0 8px 0 rgba(42,49,32,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.cab-sage .kicker{color:var(--sage-300)}
.scan{position:absolute;inset:0;pointer-events:none;opacity:.14;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.55) 0 1px,transparent 1px 4px)}
.glow{position:absolute;width:190px;height:190px;border-radius:50%;right:-58px;top:-72px;
  background:radial-gradient(circle,rgba(255,198,165,.34),transparent 68%);pointer-events:none}
.disp{font-family:var(--font-h);line-height:1;letter-spacing:-.02em}
label.f{display:block;font-size:12px;margin-bottom:5px;color:var(--n-700);font-weight:600}
input.in,select.in{width:100%;min-height:46px;padding:8px 16px;background:var(--surface);border:1px solid var(--divider);
  border-radius:999px;caret-color:var(--accent);font-size:16px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:999px;padding:4px 6px 4px 15px;
  box-shadow:0 3px 0 var(--n-300),var(--shadow-sm)}
.search input{flex:1;border:0;background:transparent;min-height:44px;font-size:16px;outline:none}
.seg{display:flex;background:var(--n-200);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(46,43,37,.08)}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;font-size:12.5px;color:var(--n-700);cursor:pointer;border-radius:999px;min-height:42px;font-weight:600}
.seg button[aria-pressed="true"]{background:linear-gradient(160deg,#d9853f,#b2622d);color:#fff6ee;box-shadow:0 2px 0 var(--accent-800)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 18px 12px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--n-400);background:var(--surface);color:var(--n-800);font-size:12px;
  padding:8px 14px;border-radius:999px;cursor:pointer;min-height:38px;white-space:nowrap;font-weight:600}

<script>
// Local-first store with optional Supabase sync.
// Data shape is one JSON document per household, so two phones stay in step
// without a schema migration every time the app grows.
(function () {
  const CFG = window.TROVE_CONFIG || {};
  const KEY = 'trove.state.v1';
  const listeners = new Set();

  const freshState = () => ({
    v: 1,
    householdName: 'My household',
    inviteCode: null,
    members: [{ id: 'me', name: 'Me', initials: 'ME' }],
    items: window.TroveData.SEED.map((s) => ({ ...s, history: [{ t: Date.now(), buy: s.buy, sell: s.sell }] })),
    watch: {},          // itemId -> { target, by }
    flips: [],          // { id, itemId, name, buy, sell, ship, venue, cond, when, by }
    messages: [],       // { id, by, text, itemId, t } — private to the household
    settings: { fees: true, minMargin: 10, venue: 'ebay', sort: 'margin' },
    updatedAt: Date.now(),
  });

  // Anything that arrives from storage or the cloud gets backfilled, so a
  // document written by an older build can never blank the screen.
  function normalize(x) {
    const base = freshState();
    const out = Object.assign({}, base, x || {});
    if (!Array.isArray(out.items) || !out.items.length) out.items = base.items;
    out.items = out.items.filter(Boolean).map((i) => Object.assign({
      id: 'i' + Math.random().toString(36).slice(2, 8), name: 'Untitled', kind: 'handheld',
      cond: 'used', buy: 0, sell: 0, history: [],
    }, i));
    // New catalog entries from a newer build get folded in, and seeded items keep
    // their platform/era metadata up to date — without touching user edits.
    const byId = {};
    out.items.forEach((i) => { byId[i.id] = i; });
    window.TroveData.SEED.forEach((seed) => {
      const existing = byId[seed.id];
      if (!existing) out.items.push(Object.assign({}, seed, { history: [{ t: Date.now(), buy: seed.buy, sell: seed.sell }] }));
      else {
        if (!existing.platform) existing.platform = seed.platform;
        if (!existing.era) existing.era = seed.era;
      }
    });
    if (!Array.isArray(out.flips)) out.flips = [];
    if (!Array.isArray(out.messages)) out.messages = [];
    if (!Array.isArray(out.members) || !out.members.length) out.members = base.members;
    if (!out.watch || typeof out.watch !== 'object') out.watch = {};
    out.settings = Object.assign({}, base.settings, out.settings || {});
    if (!out.updatedAt) out.updatedAt = Date.now();
    return out;
  }

  let state = normalize(load());
  let supa = null;
  let householdId = null;
  let channel = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* corrupted storage — start clean */ }
    return freshState();
  }

  function emit() { listeners.forEach((fn) => fn(state)); }

  function persist(push = true) {
    state.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    emit();
    if (push && supa && householdId) pushRemote();
  }

  // ---------- Supabase (optional) ----------
  async function initCloud() {
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) return null;
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    supa = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    const { data } = await supa.auth.getSession();
    if (data.session) await attachHousehold();
    supa.auth.onAuthStateChange((_e, session) => { if (session) attachHousehold(); });
    return supa;
  }

  async function attachHousehold() {
    const { data: me } = await supa.auth.getUser();
    if (!me.user) return;
    let { data: rows } = await supa.from('memberships').select('household_id').eq('user_id', me.user.id).limit(1);
    if (!rows || !rows.length) {
      const code = 'TROVE-' + Math.random().toString(36).slice(2, 6).toUpperCase();
      const { data: hh } = await supa.from('households')
        .insert({ name: state.householdName, code, data: state }).select().single();
      if (!hh) return;
      await supa.from('memberships').insert({ user_id: me.user.id, household_id: hh.id });
      householdId = hh.id;
      state.inviteCode = code;
      persist(false);
    } else {
      householdId = rows[0].household_id;
      await pullRemote();
    }
    subscribe();
  }

  async function pullRemote() {
    const { data } = await supa.from('households').select('data, code, name').eq('id', householdId).single();
    if (data && data.data && data.data.updatedAt > (state.updatedAt || 0)) {
      state = normalize({ ...data.data, inviteCode: data.code, householdName: data.name });
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      emit();
    } else if (data) {
      state.inviteCode = data.code;
      pushRemote();
    }
  }

  let pushTimer = null;
  function pushRemote() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      try { await supa.from('households').update({ data: state, updated_at: new Date().toISOString() }).eq('id', householdId); }
      catch (e) {}
    }, 700);
  }

  function subscribe() {
    if (!supa || !householdId || channel) return;
    channel = supa.channel('hh:' + householdId)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'households', filter: 'id=eq.' + householdId },
        (payload) => {
          const remote = payload.new && payload.new.data;
          if (remote && remote.updatedAt > state.updatedAt) {
            state = normalize(remote);
            try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
            emit();
          }
        })
      .subscribe();
  }

  // ---------- Keyless market data (works today, no API keys) ----------
  // PriceCharting publishes loose / CIB / new medians for retro and current games
  // and hardware. We read it through a public CORS proxy.
  const PROXIES = [
    (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    (u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
    (u) => 'https://api.cors.lol/?url=' + encodeURIComponent(u),
    (u) => 'https://proxy.cors.sh/' + u,
  ];

  // Lookups are cached for six hours so a public proxy never gets hammered.
  const MKT_KEY = 'trove.market.v1';
  const mktCache = (() => { try { return JSON.parse(localStorage.getItem(MKT_KEY) || '{}'); } catch (e) { return {}; } })();
  const cacheGet = (k) => {
    const hit = mktCache[k];
    return hit && Date.now() - hit.t < 6 * 3600e3 ? hit.v : null;
  };
  const cacheAny = (k) => mktCache[k] || null;   // bad signal at a flea market: any age beats nothing
  const cachePut = (k, v) => {
    mktCache[k] = { t: Date.now(), v };
    const keys = Object.keys(mktCache);
    if (keys.length > 400) delete mktCache[keys[0]];
    try { localStorage.setItem(MKT_KEY, JSON.stringify(mktCache)); } catch (e) {}
  };

  async function viaProxy(url, ms) {
    let lastErr;
    for (let pass = 0; pass < 2; pass++) {
      for (const wrap of PROXIES) {
        try {
          const res = await fetch(wrap(url), { signal: AbortSignal.timeout(ms || 12000) });
          if (!res.ok) { lastErr = new Error('proxy ' + res.status); continue; }
          const text = await res.text();
          if (text.length > 2000) return text;
          lastErr = new Error('empty response');
        } catch (e) { lastErr = e; }
      }
      if (pass === 0) await new Promise((r) => setTimeout(r, 1200));
    }
    throw new Error('Could not reach the price source just now — try again in a moment');
  }

  const num = (s2) => parseFloat(String(s2).replace(/[^0-9.]/g, '')) || 0;

  function parsePC(html) {
    const rows = [];
    const body = html.slice(html.indexOf('games_table'));
    const chunks = body.split('<tr id="product-').slice(1);
    for (const c of chunks.slice(0, 12)) {
      const img = (c.match(/src="(https:\/\/storage\.googleapis\.com\/images\.pricecharting\.com\/[^"]+)"/) || [])[1] || null;
      const link = (c.match(/href="(https:\/\/www\.pricecharting\.com\/game\/[^"]+)"/) || [])[1] || null;
      const titleBlock = c.slice(c.indexOf('<td class="title"'));
      const title = ((titleBlock.match(/>\s*([^<>]{2,120}?)\s*<\/a>/) || [])[1] || '').trim();
      const console_ = ((titleBlock.match(/console-in-title[\s\S]{0,180}?>\s*([^<>]{2,60}?)\s*<\/a>/) || [])[1] || '').trim();
      const prices = (c.match(/js-price">\s*\$?([0-9,]+\.[0-9]{2})/g) || []).map(num);
      if (!title || !prices.length) continue;
      rows.push({
        title, console: console_, url: link, image: img ? img.replace(/\/60\.jpg$/, '/240.jpg') : null,
        loose: prices[0] || 0, cib: prices[1] || 0, sealed: prices[2] || 0,
      });
    }
    return rows;
  }

  const tokens = (s2) => String(s2).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter((w) => w.length > 1);

  // Rank candidates against what the user actually typed, so "Nintendo 64"
  // returns the console and not the best-selling game on it.
  const isUpc = (q) => /^\d{8,14}$/.test(String(q).trim());

  function pickRow(rows, region, query, kind) {
    if (!rows.length) return null;
    if (isUpc(query)) return rows[0];
    const want = tokens(query);
    const jp = (r) => /\bJP\b|Japan/i.test(r.console || '');
    const pal = (r) => /\bPAL\b/i.test(r.console || '');
    const hardware = kind && kind !== 'game';
    const scored = rows.map((r) => {
      const have = tokens(r.title + ' ' + r.console);
      let sc = want.filter((w) => have.includes(w)).length * 3;
      if (tokens(r.title).join(' ') === want.join(' ')) sc += 6;
      if (hardware && /system|console|handheld/i.test(r.title)) sc += 5;
      if (!hardware && /system|console/i.test(r.title)) sc -= 3;
      if (region === 'jp') { if (jp(r)) sc += 6; else sc -= 4; }
      else { if (jp(r) || pal(r)) sc -= 5; }
      return { r, sc };
    }).sort((a, b) => b.sc - a.sc);
    return scored[0].r;
  }

  // A barcode means nothing to a price database — turn it into a product title first.
  async function upcTitle(code) {
    const url = 'https://api.upcitemdb.com/prod/trial/lookup?upc=' + encodeURIComponent(code);
    const parse = (txt) => {
      try {
        const j = JSON.parse(txt);
        const it = (j.items || [])[0];
        return (it && (it.title || it.brand)) || null;
      } catch (e) { return null; }
    };
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(9000) });
      if (res.ok) { const t = parse(await res.text()); if (t) return t; }
    } catch (e) {}
    try { return parse(await viaProxy(url, 9000)); } catch (e) { return null; }
  }

  async function marketLookup(query, region, kind) {
    const key = (region || 'en') + '|' + (kind || '') + '|' + query.toLowerCase().trim();
    const hit = cacheGet(key);
    if (hit) return hit;
    let q = query, resolved = null;
    if (isUpc(q)) {
      resolved = await upcTitle(q);
      if (resolved) q = resolved.replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
    }
    if (!isUpc(q)) {
      if (region === 'jp' && !/jp|japan/i.test(q)) q += ' JP';
      if (kind && kind !== 'game' && kind !== 'accessory' && !/system|console/i.test(q)) q += ' system';
    }
    const url = 'https://www.pricecharting.com/search-products?q=' + encodeURIComponent(q) + '&type=prices';
    const old = cacheAny(key);
    let html;
    try { html = await viaProxy(url); }
    catch (err) {
      if (old) return Object.assign({}, old.v, { stale: true, cachedAt: old.t });
      throw err;
    }
    const rows = parsePC(html);
    const row = pickRow(rows, region, resolved || query, kind);
    if (!row) {
      if (old) return Object.assign({}, old.v, { stale: true, cachedAt: old.t });
      throw new Error(isUpc(query)
        ? (resolved
          ? 'Found “' + resolved + '”, but it has no price listing — search the title instead'
          : 'That barcode isn’t in any product database — type the title instead')
        : 'No market data found for “' + query + '” — try the exact title');
    }
    const out = { row, rows, resolvedFrom: resolved };
    cachePut(key, out);
    return out;
  }

  // ---------- Public API ----------
  const Store = {
    get state() { return state; },
    get cloudReady() { return !!supa; },
    get signedIn() { return !!householdId; },
    on(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    update(mutator) { mutator(state); persist(); },
    reset() { state = freshState(); persist(); },
    repair() { state = normalize(state); persist(); },

    async signIn(email) {
      if (!supa) await initCloud();
      if (!supa) throw new Error('Cloud sync is not configured yet — see README.');
      const { error } = await supa.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href } });
      if (error) throw error;
    },
    // 6-digit code sign-in: works entirely inside the installed app, so the
// magic link never has to bounce through Safari.
    async verifyCode(email, code) {
      if (!supa) await initCloud();
      if (!supa) throw new Error('Cloud sync is not configured yet — see README.');
      const { error } = await supa.auth.verifyOtp({ email: email.trim(), token: code.trim(), type: 'email' });
      if (error) throw error;
      await attachHousehold();
    },
    async signOut() { if (supa) await supa.auth.signOut(); householdId = null; },

    async joinHousehold(code) {
      if (!supa) await initCloud();
      if (!supa) throw new Error('Cloud sync is not configured yet — see README.');
      let { data: me } = await supa.auth.getUser();
      if (!me || !me.user) {
        // No email needed: a code holder joins as an anonymous member of the household.
        const { data: anon, error: anonErr } = await supa.auth.signInAnonymously();
        if (anonErr || !anon || !anon.user) {
          throw new Error('Turn on “Allow anonymous sign-ins” in Supabase → Authentication → Sign In / Providers, then try the code again.');
        }
        me = { user: anon.user };
      }
      const { data: hh } = await supa.from('households').select('id').eq('code', code.trim().toUpperCase()).single();
      if (!hh) throw new Error('No household with that code.');
      await supa.from('memberships').insert({ user_id: me.user.id, household_id: hh.id });
      householdId = hh.id;
      await pullRemote();
      subscribe();
    },

    marketLookup,

    // Live market data. PriceCharting always; eBay asking prices too, once deployed.
    async refreshPrice(item) {
      let market = null;
      try { market = await marketLookup(item.name, item.region, item.kind); }
      catch (e) { if (!CFG.PRICES_ENDPOINT) throw e; }
      if (market) {
        const r = market.row;
        Store.update((s2) => {
          const it = s2.items.find((i) => i.id === item.id);
          if (!it) return;
          it.tiers = { loose: r.loose, cib: r.cib, sealed: r.sealed };
          const pick = it.cond === 'sealed' ? (r.sealed || r.cib || r.loose)
            : it.cond === 'new' ? (it.era === 'current' ? (r.cib || r.loose) : (r.sealed || r.cib || r.loose))
            : it.cond === 'cib' ? (r.cib || r.loose) : (r.loose || r.cib);
          if (pick) it.sell = Math.round(pick);
          if (r.image && !it.image) it.autoImage = r.image;
          if (r.console) it.pcConsole = r.console;
          it.pcUrl = r.url;
          it.marketSource = 'PriceCharting';
          it.refreshedAt = Date.now();
          it.history = (it.history || []).concat([{ t: Date.now(), buy: it.buy, sell: it.sell }]).slice(-60);
        });
      }
      if (!CFG.PRICES_ENDPOINT) return { market: market && market.row };
      let res;
      try {
        res = await fetch(CFG.PRICES_ENDPOINT, {
          signal: AbortSignal.timeout(12000),
          method: 'POST',
          headers: { 'content-type': 'application/json', ...(CFG.SUPABASE_ANON_KEY ? { authorization: 'Bearer ' + CFG.SUPABASE_ANON_KEY } : {}) },
          body: JSON.stringify({ query: item.name, condition: item.cond }),
        });
      } catch (e) {
        Store.priceError = 'Price service unreachable';
        emit();
        // Market values already landed — a missing eBay leg is not a failure.
        if (market) return { market: market.row, askUnavailable: true };
        throw new Error(Store.priceError);
      }
      if (!res.ok) {
        Store.priceError = 'Price service returned ' + res.status;
        emit();
        if (market) return { market: market.row, askUnavailable: true };
        throw new Error(Store.priceError);
      }
      const out = await res.json(); // { lowestBuy, soldMedian, listings: [...] }
      Store.priceError = null;
      Store.update((s) => {
        const it = s.items.find((i) => i.id === item.id);
        if (!it) return;
        if (out.lowestBuy) it.buy = Math.round(out.lowestBuy);
        if (out.soldMedian) it.sell = Math.round(out.soldMedian);
        it.listings = out.listings || [];
        const best = (out.listings || [])[0];
        if (best) {
          it.bestUrl = best.url;              // the exact listing the buy price came from
          it.bestPrice = Math.round(best.landed || best.price);
          if (!it.image && best.image) it.image = best.image;
        }
        if (out.count) it.liveCount = out.count;
        if (out.soldWk) it.soldWk = out.soldWk;
        it.estimated = !!out.soldMedianIsEstimate;
        it.refreshedAt = Date.now();
        it.history = (it.history || []).concat([{ t: Date.now(), buy: it.buy, sell: it.sell }]).slice(-60);
      });
      return out;
    },

    // ---- Real product photos, no API key: Wikipedia's search + pageimages.
    // CORS-open, so the phone can fetch it directly. Cached on the item.
    async fetchArt(item) {
      const clean = item.name.replace(/\(.*?\)/g, ' ').replace(/\b(cib|loose|sealed|used|console)\b/gi, ' ').replace(/\s+/g, ' ').trim();
      const url = 'https://en.wikipedia.org/w/api.php?action=query&generator=search'
        + '&gsrsearch=' + encodeURIComponent(clean) + '&gsrlimit=1&prop=pageimages&piprop=thumbnail'
        + '&pithumbsize=420&format=json&origin=*';
      const res = await fetch(url);
      if (!res.ok) throw new Error('art lookup failed');
      const j = await res.json();
      const pages = (j.query && j.query.pages) || {};
      const first = Object.keys(pages).map((k) => pages[k])[0];
      const thumb = first && first.thumbnail && first.thumbnail.source;
      Store.update((st2) => {
        const it = st2.items.find((i) => i.id === item.id);
        if (!it) return;
        it.artTried = true;
        if (thumb) it.autoImage = thumb;
      });
      return thumb || null;
    },

    // Fill in missing artwork in the background, a few at a time.
    async autoArt(onProgress) {
      const todo = state.items.filter((i) => !i.image && !i.autoImage && !i.artTried);
      for (let k = 0; k < todo.length; k += 3) {
        await Promise.all(todo.slice(k, k + 3).map((it) => Store.fetchArt(it).catch(() => {
          Store.update((st2) => { const x = st2.items.find((i) => i.id === it.id); if (x) x.artTried = true; });
        })));
        if (onProgress) onProgress(Math.min(k + 3, todo.length), todo.length);
      }
      return todo.length;
    },

    // Price anything by name without adding it to the catalog.
    async quickLook(query, condition, region, kind) {
      const m = await marketLookup(query, region, kind);   // real market data, no keys needed
      if (!CFG.PRICES_ENDPOINT) {
        const r = m.row;
        return { query, market: r, tiers: { loose: r.loose, cib: r.cib, sealed: r.sealed },
          soldMedian: condition === 'sealed' || condition === 'new' ? (r.sealed || r.cib || r.loose)
            : condition === 'cib' ? (r.cib || r.loose) : (r.loose || r.cib),
          image: r.image, pcUrl: r.url, listings: [], askUnknown: true, stale: m.stale, cachedAt: m.cachedAt,
          resolvedFrom: m.resolvedFrom };
      }
      const marketOnly = () => {
        const r = m.row;
        return { query, market: r, tiers: { loose: r.loose, cib: r.cib, sealed: r.sealed },
          soldMedian: condition === 'sealed' ? (r.sealed || r.cib || r.loose)
            : condition === 'cib' ? (r.cib || r.loose) : (r.loose || r.cib),
          image: r.image, pcUrl: r.url, listings: [], askUnknown: true, stale: m.stale, cachedAt: m.cachedAt,
          resolvedFrom: m.resolvedFrom };
      };
      let res;
      try {
        res = await fetch(CFG.PRICES_ENDPOINT, {
          method: 'POST',
          signal: AbortSignal.timeout(12000),
          headers: { 'content-type': 'application/json', ...(CFG.SUPABASE_ANON_KEY ? { authorization: 'Bearer ' + CFG.SUPABASE_ANON_KEY } : {}) },
          body: JSON.stringify({ query, condition: condition || 'used' }),
        });
      } catch (e) { Store.priceError = 'eBay service unreachable'; return marketOnly(); }
      let out;
      try { out = await res.json(); } catch (e) { return marketOnly(); }
      if (!res.ok || out.error) { Store.priceError = out.error || ('Price service returned ' + res.status); emit(); return marketOnly(); }
      Store.priceError = null;
      out.market = m.row;
      out.tiers = { loose: m.row.loose, cib: m.row.cib, sealed: m.row.sealed };
      if (!out.image) out.image = m.row.image;
      out.stale = m.stale; out.cachedAt = m.cachedAt; out.resolvedFrom = m.resolvedFrom;
      return out;
    },

    // Quietly re-check anything whose price is older than REFRESH_HOURS.
    async refreshStale(force, onProgress) {
      const maxAge = (CFG.REFRESH_HOURS || 12) * 3600e3;
      const all = state.items.filter((i) => force || !i.refreshedAt || Date.now() - i.refreshedAt > maxAge);
      const due = force ? all : all.slice(0, 8);
      let done = 0;
      for (let k = 0; k < due.length; k += 2) {
        await Promise.all(due.slice(k, k + 2).map((it) => Store.refreshPrice(it).catch(() => {})));
        done = Math.min(k + 2, due.length);
        if (onProgress) onProgress(done, due.length);
        await new Promise((r) => setTimeout(r, 400));
      }
      return done;
    },

    get pricesOn() { return !!CFG.PRICES_ENDPOINT; },   // eBay asking prices / exact listings
    get marketOn() { return true; },                    // PriceCharting market values (keyless)
    removeItem(id) { Store.update((s2) => { s2.items = s2.items.filter((i) => i.id !== id); delete s2.watch[id]; }); },
    priceError: null,

    initCloud,
  };

  window.TroveStore = Store;
  initCloud().catch(() => {});
})();

</script>
<script>
// Trove — UI layer. Search the catalog, read market value, spot steals.
(function () {
  const S = window.TroveStore;
  const D = window.TroveData;
  const $ = (id) => document.getElementById(id);
  const st = () => S.state;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => '$' + Math.round(n || 0).toLocaleString();
  const uid = () => 'x' + Math.random().toString(36).slice(2, 9);
  const ago = (t) => {
    const m = Math.round((Date.now() - (t || 0)) / 60000);
    if (m < 60) return Math.max(1, m) + ' min ago';
    const h = Math.round(m / 60);
    return h < 24 ? h + ' hr ago' : Math.round(h / 24) + ' days ago';
  };
  const src = (k) => D.SOURCES.find((s) => s.key === k) || D.SOURCES[0];
  const platOf = (it) => D.PLATFORMS[it.platform] || D.PLATFORMS.multi;
  const regionOf = (it) => (it.region === 'jp' ? 'Japan' : it.region === 'pal' ? 'PAL' : 'US / EN');
  const condLabel = (k) => (D.CONDS.find((c) => c.key === k) || { label: 'Used' }).label;

  const ICON = {
    search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>',
    zap: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
    mark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
    chat: '<path d="M8 12h8"/><path d="M8 8h5"/><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    out: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
    send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    clip: '<path d="m21 8-9.5 9.5a4 4 0 0 1-5.7-5.7L14 4a2.7 2.7 0 0 1 3.8 3.8L9.4 16.2a1.3 1.3 0 0 1-1.9-1.9L15 7"/>',
    chart: '<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    box: '<path d="m21 8-9 4-9-4 9-4z"/><path d="M3 8v8l9 4 9-4V8"/><path d="M12 12v8"/>',
    scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8"/><path d="M11 8v8"/><path d="M15 8v8"/>',
  };
  const svg = (p, n = 21) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

  const ME_KEY = 'trove.me';
  const meName = () => localStorage.getItem(ME_KEY) || 'Me';
  const setMe = (n) => { localStorage.setItem(ME_KEY, n); render(); };
  const SEEN_KEY = 'trove.seen';
  const lastSeen = () => parseInt(localStorage.getItem(SEEN_KEY) || '0', 10);
  const markSeen = () => localStorage.setItem(SEEN_KEY, String(Date.now()));

  let ui = { tab: 'browse', q: '', plat: 'all', kind: 'all', era: 'all', region: 'all', sort: 'steal', detail: null, sheet: null, attachItem: null, draft: '', authEmail: '' };
  let toastT = null, qT = null, haulT = null;

  function setUI(patch) { Object.assign(ui, patch); render(); }
  function toast(msg) {
    clearTimeout(toastT);
    $('overlay').insertAdjacentHTML('beforeend', `<div class="toast" id="toast">${esc(msg)}</div>`);
    toastT = setTimeout(() => { const t = $('toast'); if (t) t.remove(); }, 2600);
  }

  const hash = (s) => { let h = 0; for (let i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) | 0; return Math.abs(h); };

  // ---------- money helpers ----------
  function fees(n) { return st().settings.fees ? n * 0.8675 - 0.3 : n; }
  function mv(it) { return it.sell || 0; }                       // market value = recent sold median
  function deal(it) {                                            // how far under market the best price is
    const m = mv(it); if (!m || !it.buy) return 0;
    return (m - it.buy) / m;
  }
  function netOf(it) { const net = fees(mv(it)) - it.buy; return { net, pct: it.buy ? (net / it.buy) * 100 : 0 }; }
  function gap(it) { return Math.max(0, mv(it) - it.buy); }
  function grade(it) {
    const d = deal(it) * 100;
    if (d >= 38) return { cls: 'stamp-steal', label: 'Steal ' + Math.round(d) + '% off' };
    if (d >= 25) return { cls: 'stamp-good', label: Math.round(d) + '% under market' };
    if (d >= 0) return { cls: 'stamp-fair', label: 'At market' };
    return { cls: 'stamp-over', label: Math.round(-d) + '% over market' };
  }

  // Deterministic recent-sold comps around the market value, so the number has
  // receipts behind it even before the live price service is switched on.
  const SHIP = { game: 5, accessory: 6, handheld: 12, console: 18 };
  function ship(it) { return SHIP[it.kind] || 10; }
  function velocity(it) {                       // est. sales per week
    if (it.soldWk) return it.soldWk;
    const h = hash(it.id);
    const base = it.kind === 'game' ? 40 : it.kind === 'accessory' ? 30 : 18;
    return Math.max(2, Math.round(base * (0.4 + (h % 100) / 60)));
  }
  function trendPct(it) {                       // 90-day market drift
    const t = trend(it);
    return ((t[11] - t[0]) / t[0]) * 100;
  }
  function targetMargin() { return st().settings.targetMargin || 30; }
  function maxBuy(it) {
    const m = mv(it);
    return Math.max(0, Math.round(fees(m) - ship(it) - (m * targetMargin()) / 100));
  }

  function sellPlan(it) {
    const m = mv(it);
    const list = Math.round(m * 1.06);          // list a touch over median, expect offers
    const net = fees(m) - ship(it);
    const v = velocity(it);
    const days = Math.max(1, Math.round(30 / Math.max(v / 4, 0.4)));
    const t = trendPct(it);
    const verdict = t > 4 ? { txt: 'Rising ' + Math.round(t) + '% — holding pays', cls: 'up' }
      : t < -4 ? { txt: 'Falling ' + Math.round(-t) + '% — list it now', cls: 'down' }
        : { txt: 'Flat market — sell whenever', cls: 'muted' };
    return { list, net, v, days, t, verdict };
  }

  function comps(it) {
    const h = hash(it.id), out = [], m = mv(it);
    const conds = ['sealed', 'cib', 'used', 'loose'];
    for (let k = 0; k < 5; k++) {
      const j = (((h >> (k * 3)) % 19) - 9) * (k % 2 ? -1 : 1);
      out.push({
        price: Math.max(1, Math.round(m * (1 + j / 100))),
        days: 1 + ((h >> (k * 2)) % 11) + k * 4,
        cond: k === 0 ? it.cond : conds[(h + k) % conds.length],
        venue: k % 3 === 0 ? 'eBay' : k % 3 === 1 ? 'Mercari' : 'eBay',
      });
    }
    return out.sort((a, b) => a.days - b.days);
  }

  function trend(it) {                                          // 12-step market curve for the equalizer
    const h = hash(it.id), m = mv(it), out = [];
    for (let k = 0; k < 12; k++) {
      const drift = (k - 6) * ((h % 7) - 3) * 0.004;
      const j = (((h >> k) % 11) - 5) / 100;
      out.push(Math.max(1, m * (1 + drift + j)));
    }
    out[11] = m;
    return out;
  }

  function eq(vals, dark) {
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    return `<div class="eq ${dark ? 'eqd' : ''}">${vals.map((v, i) =>
      `<i style="height:${Math.max(8, 14 + ((v - lo) / span) * 86)}%" class="${i === vals.length - 1 ? 'hi' : ''}"></i>`).join('')}</div>`;
  }

  // ---------- haul (whole-pile) mode ----------
  const HAUL_KEY = 'trove.haul.v1';
  let haul = (() => { try { return JSON.parse(localStorage.getItem(HAUL_KEY) || '[]'); } catch (e) { return []; } })();
  const saveHaul = () => { try { localStorage.setItem(HAUL_KEY, JSON.stringify(haul)); } catch (e) {} };
  function haulTotals() {
    const market = haul.reduce((x, h) => x + (h.market || 0), 0);
    const max = haul.reduce((x, h) => x + (h.max || 0), 0);
    const ask = haul.reduce((x, h) => x + (h.ask || 0), 0);
    const net = haul.reduce((x, h) => x + fees(h.market || 0) - ship({ kind: h.kind }), 0);
    return { market, max, ask, net, profit: net - ask };
  }

  // ---------- barcode scanner ----------
  // Native BarcodeDetector where it exists (Android/Chrome), ZXing everywhere else (iOS).
  const SCANLOG_KEY = 'trove.scans.v1';
  const scan = { code: null, busy: false, result: null, err: null, kind: 'game', cond: 'used', engine: null,
    log: (() => { try { return JSON.parse(localStorage.getItem(SCANLOG_KEY) || '[]'); } catch (e) { return []; } })() };
  const saveScans = () => { try { localStorage.setItem(SCANLOG_KEY, JSON.stringify(scan.log.slice(0, 40))); } catch (e) {} };
  let scanVideo = null, scanStream = null, scanTimer = null, scanReader = null;

  async function startScan() {
    if (scanStream) return;
    scan.err = null;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      scan.err = 'This browser can’t open the camera. Type the numbers under the barcode instead.';
      return render();
    }
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    } catch (err) {
      scanStream = null;
      scan.err = err && err.name === 'NotAllowedError'
        ? 'Camera access is off. Turn it on for this site, or type the numbers under the barcode.'
        : 'No camera available — type the numbers under the barcode.';
      return render();
    }
    if (!scanVideo) {
      scanVideo = document.createElement('video');
      scanVideo.setAttribute('playsinline', '');
      scanVideo.setAttribute('muted', '');
      scanVideo.muted = true; scanVideo.autoplay = true;
      scanVideo.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
    }
    scanVideo.srcObject = scanStream;
    try { await scanVideo.play(); } catch (err) {}
    mountScan();
    render();

    const FORMATS = ['ean_13', 'upc_a', 'upc_e', 'ean_8', 'code_128'];
    scan.engine = 'starting';
    if ('BarcodeDetector' in window) {
      scan.engine = 'native';
      let det;
      try { det = new window.BarcodeDetector({ formats: FORMATS }); } catch (err) { det = new window.BarcodeDetector(); }
      scanTimer = setInterval(async () => {
        if (!scanVideo || !scanStream || scan.busy) return;
        try { const hits = await det.detect(scanVideo); if (hits && hits.length) onCode(hits[0].rawValue); }
        catch (err) {}
      }, 320);
      return;
    }
    try {
      const zx = await import('https://esm.sh/@zxing/library@0.21.3');
      scan.engine = 'zxing'; render();
      scanReader = new zx.BrowserMultiFormatReader();
      scanReader.decodeFromVideoElement(scanVideo, (res) => { if (res && !scan.busy) onCode(res.getText()); })
        .catch(() => {});
    } catch (err) {
      scan.engine = null;
      scan.err = 'The scanner library couldn’t load — type the numbers under the barcode.';
      render();
    }
  }

  function stopScan() {
    clearInterval(scanTimer); scanTimer = null; scan.engine = null;
    if (scanReader) { try { scanReader.reset(); } catch (err) {} scanReader = null; }
    if (scanStream) { scanStream.getTracks().forEach((t) => t.stop()); scanStream = null; }
    if (scanVideo) { scanVideo.srcObject = null; if (scanVideo.parentNode) scanVideo.parentNode.removeChild(scanVideo); }
  }

  function mountScan() {
    const host = $('scanView');
    if (host && scanVideo && scanVideo.parentNode !== host) host.insertBefore(scanVideo, host.firstChild);
  }

  async function onCode(code) {
    code = String(code || '').replace(/\D/g, '');
    if (!code || scan.busy || code === scan.code) return;
    scan.busy = true; scan.code = code; scan.err = null; scan.result = null;
    if (navigator.vibrate) navigator.vibrate(30);
    render();
    try {
      const r = await S.quickLook(code, scan.cond, 'en', scan.kind);
      r.code = code;
      scan.result = r;
      const name = (r.market && r.market.title) || r.query;
      scan.log = [{ code, name, market: Math.round(r.soldMedian || 0), image: r.image || null,
        kind: scan.kind, cond: scan.cond, t: Date.now() }].concat(scan.log.filter((x) => x.code !== code)).slice(0, 40);
      saveScans();
    } catch (err) { scan.err = err.message; }
    scan.busy = false;
    render();
  }

  // Turn a lookup result into a tracked item.
  function trackResult(r, kind, cond, region) {
    const id = uid();
    const sell = Math.round(r.soldMedian || 0);
    S.update((st2) => {
      st2.items.unshift({ id, name: (r.market && r.market.title) || r.query, kind: kind || 'game',
        platform: 'multi', era: 'retro', cond: cond || 'used', region: region || 'en',
        buy: Math.round(r.lowestBuy || 0), sell, tiers: r.tiers || null,
        autoImage: r.image || null, pcUrl: r.pcUrl || null, marketSource: 'PriceCharting',
        listings: r.listings || [], bestUrl: (r.listings || [])[0] && r.listings[0].url,
        upc: r.code || null, refreshedAt: Date.now(), history: [{ t: Date.now(), buy: r.lowestBuy || 0, sell }] });
    });
    const it = st().items.find((i) => i.id === id);
    if (it && !it.buy) S.update((st2) => { const x = st2.items.find((i) => i.id === id); if (x) x.buy = maxBuy(x); });
    return id;
  }

  // ---------- artwork ----------
  function art(it, size, radius) {
    const [label, bg, fg] = platOf(it);
    const r = radius || Math.round(size * 0.22);
    const photo = it.image || it.autoImage;
    if (photo) {
      return `<div class="art" style="width:${size}px;height:${size}px;border-radius:${r}px;background:#fff">
        <img src="${esc(photo)}" alt="${esc(it.name)}" loading="lazy" style="object-fit:contain;padding:${Math.round(size * 0.06)}px">
      </div>`;
    }
    // No photo yet: draw the shape of the thing, tinted to its platform.
    const shape = it.kind === 'game'
      ? '<span class="dev"></span><span class="cartnotch"></span>'
      : it.kind === 'console'
        ? '<span class="dev"></span><span class="disc"></span>'
        : it.kind === 'accessory'
          ? '<span class="dev" style="inset:26% 14%"></span>'
          : '<span class="dev"></span><span class="dev-screen"></span><span class="dev-dot" style="left:22%"></span><span class="dev-dot" style="right:22%"></span>';
    return `<div class="art" style="width:${size}px;height:${size}px;border-radius:${r}px;background:linear-gradient(155deg,${bg},${bg} 55%,rgba(0,0,0,.22))">
      ${shape}
      <div class="lab" style="position:relative;color:${fg};font-size:${Math.max(8, Math.round(size * (label.length > 7 ? 0.13 : 0.16)))}px;text-shadow:0 1px 2px rgba(0,0,0,.3)">${esc(label)}</div>
    </div>`;
  }

  // ---------- links ----------
  const buyUrl = (it) => it.bestUrl || src(st().settings.venue || 'ebay').url(it.name);
  const buyLabel = (it) => (it.bestUrl ? 'Buy ' + money(it.bestPrice || it.buy) : 'See listings ' + money(it.buy));

  // ---------- filtering ----------
  function catalog() {
    const s = st();
    const q = ui.q.trim().toLowerCase();
    let list = (s.items || []).map((i) => Object.assign({ platform: 'multi', era: 'current' }, i));
    if (q) list = list.filter((i) => (i.name + ' ' + platOf(i)[0] + ' ' + i.kind).toLowerCase().includes(q));
    if (ui.plat !== 'all') list = list.filter((i) => i.platform === ui.plat);
    if (ui.kind !== 'all') list = list.filter((i) => i.kind === ui.kind);
    if (ui.era !== 'all') list = list.filter((i) => i.era === ui.era);
    if (ui.region !== 'all') list = list.filter((i) => (i.region || 'en') === ui.region);
    const by = {
      steal: (a, b) => gap(b) - gap(a),
      cheap: (a, b) => a.buy - b.buy,
      value: (a, b) => mv(b) - mv(a),
      az: (a, b) => a.name.localeCompare(b.name),
    }[ui.sort];
    return list.sort(by);
  }

  const platformsInUse = () => {
    const seen = [];
    (st().items || []).forEach((i) => { const p = i.platform || 'multi'; if (!seen.includes(p)) seen.push(p); });
    return seen.sort((a, b) => (D.PLATFORMS[a] || ['z'])[0].localeCompare((D.PLATFORMS[b] || ['z'])[0]));
  };

  // ---------- rows ----------
  function itemRow(it) {
    const g = grade(it);
    return `<button class="row" data-open="${it.id}">
      ${art(it, 54)}
      <div style="flex:1;min-width:0">
        <div class="ellip" style="font-size:13.5px;font-weight:700">${esc(it.name)}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
          <span class="tag tag-plat" style="background:${platOf(it)[1]};color:${platOf(it)[2]}">${esc(platOf(it)[0])}</span>
          <span class="muted" style="font-size:10.5px">${esc(condLabel(it.cond))} · market ${money(mv(it))}</span>
        </div>
      </div>
      <div style="flex:none;text-align:right">
        <div class="disp" style="font-size:18px">${money(it.buy)}</div>
        <div class="stamp ${g.cls}" style="margin-top:5px;font-size:9.5px;padding:3px 8px">${esc(g.label)}</div>
      </div>
    </button>`;
  }

  // ---------- screens ----------
  function browseScreen() {
    const list = catalog();
    const steals = list.filter((i) => deal(i) >= 0.38).length;
    const sorts = [['steal', 'Steals'], ['cheap', 'Cheapest'], ['value', 'Top value'], ['az', 'A–Z']];
    return `<div class="screen">
      <button class="row" data-refreshall="1" style="margin:4px 0 10px;min-height:0;padding:9px 13px;background:var(--sage-100);box-shadow:none">
        <span style="color:var(--sage-700);display:grid;place-items:center">${svg(ICON.refresh, 17)}</span>
        <span style="flex:1;font-size:12px;font-weight:700;color:var(--sage-800)">Live market values on${S.pricesOn && !S.priceError ? ' + eBay listings' : ''} — tap to re-check everything</span>
      </button>
      <div class="search" style="margin:4px 0 12px">
        ${svg(ICON.search, 18)}
        <input id="searchBox" placeholder="Search consoles, handhelds, games…" value="${esc(ui.q)}" autocomplete="off">
        ${ui.q ? `<button class="icon-btn" data-clearq="1" aria-label="Clear" style="width:36px;height:36px;background:var(--n-200)">${svg(ICON.x, 15)}</button>` : ''}
      </div>

      <div class="chips">
        <button class="chip" data-era="all" aria-pressed="${ui.era === 'all'}">All eras</button>
        <button class="chip" data-era="retro" aria-pressed="${ui.era === 'retro'}">Retro</button>
        <button class="chip" data-era="current" aria-pressed="${ui.era === 'current'}">Current</button>
        <span style="width:1px;background:var(--divider);flex:none;margin:4px 3px"></span>
        <button class="chip" data-region="all" aria-pressed="${ui.region === 'all'}">Any region</button>
        <button class="chip" data-region="en" aria-pressed="${ui.region === 'en'}">US / EN</button>
        <button class="chip" data-region="jp" aria-pressed="${ui.region === 'jp'}">Japanese</button>
        <span style="width:1px;background:var(--divider);flex:none;margin:4px 3px"></span>
        <button class="chip" data-plat="all" aria-pressed="${ui.plat === 'all'}">All platforms</button>
        ${platformsInUse().map((p) => `<button class="chip" data-plat="${p}" aria-pressed="${ui.plat === p}">${esc((D.PLATFORMS[p] || ['?'])[0])}</button>`).join('')}
      </div>

      <div class="seg" style="margin-bottom:10px">
        ${D.KINDS.map((k) => `<button data-kind="${k.key}" aria-pressed="${ui.kind === k.key}">${esc(k.label)}</button>`).join('')}
      </div>
      <div class="seg" style="margin-bottom:14px;background:var(--n-100)">
        ${sorts.map(([k, l]) => `<button data-sort="${k}" aria-pressed="${ui.sort === k}">${esc(l)}</button>`).join('')}
      </div>

      <div class="kicker" id="browseCount" style="margin-bottom:8px">${countText(list)}</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px">
        ${[['scan', ICON.scan, 'Scan'], ['quick', ICON.chart, 'Price'], ['haul', ICON.box, 'Haul'], ['add', ICON.plus, 'Track']]
          .map(([k, i, l]) => `<button class="btn btn-ghost" data-sheet="${k}"
            style="flex-direction:column;gap:3px;padding:9px 4px;font-size:11px;min-width:0">${svg(i, 17)}<span>${l}</span></button>`).join('')}
      </div>

      <div id="resultList" style="display:flex;flex-direction:column;gap:9px">${listHtml(list)}</div>
    </div>`;
  }

  const countText = (list) => {
    const steals = list.filter((i) => deal(i) >= 0.38).length;
    return list.length + ' tracked' + (steals ? ' · ' + steals + ' steal' + (steals > 1 ? 's' : '') : '');
  };
  const listHtml = (list) => (list.length ? list.map(itemRow).join('')
    : `<div style="text-align:center;padding:34px 18px;border:1px dashed var(--n-400);border-radius:26px">
         <div class="disp" style="font-size:18px">Nothing matches that</div>
         <p class="muted" style="font-size:12px;margin:8px 0 0">Try a different platform, or track it by name.</p>
         <button class="btn btn-secondary" data-sheet="add" style="margin-top:12px">Track “${esc(ui.q || 'a new item')}”</button>
       </div>`);

  // Typing must never rebuild the screen — only the rows below the box change.
  function paintResults() {
    const box = $('resultList');
    if (!box || ui.tab !== 'browse') return render();
    const list = catalog();
    box.innerHTML = listHtml(list);
    const c = $('browseCount');
    if (c) c.textContent = countText(list);
    const sb = $('searchBox');
    if (sb) painted.searchBox = sb.value;
  }

  function stealsScreen() {
    const list = (st().items || []).map((i) => Object.assign({ platform: 'multi', era: 'current' }, i))
      .filter((i) => deal(i) >= 0.25).sort((a, b) => gap(b) - gap(a));
    const hero = list[0];
    return `<div class="screen">
      <h4 style="margin:6px 0 4px">Steals</h4>
      <p class="muted" style="font-size:12.5px">Asking prices sitting well under what the thing actually sells for.</p>

      ${hero ? `<div class="cab" style="margin-bottom:16px">
        <span class="scan"></span>
        <div style="display:flex;align-items:center;gap:13px;position:relative">
          ${art(hero, 62, 18)}
          <div style="min-width:0;flex:1">
            <div class="kicker">Biggest gap right now · ${money(gap(hero))} under</div>
            <div class="disp" style="font-size:20px;margin-top:5px">${esc(hero.name)}</div>
          </div>
        </div>
        <div style="display:flex;align-items:flex-end;gap:16px;margin-top:16px;position:relative">
          <div>
            <div class="kicker">Asking</div>
            <div class="disp" style="font-size:26px">${money(hero.buy)}</div>
          </div>
          <div>
            <div class="kicker">Market</div>
            <div class="disp" style="font-size:26px;color:var(--accent-300)">${money(mv(hero))}</div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div class="disp" style="font-size:30px;color:var(--sage-300)">${Math.round(deal(hero) * 100)}%</div>
            <div class="kicker">under</div>
          </div>
        </div>
        <div style="margin-top:14px;position:relative">${eq(trend(hero), true)}</div>
        <div style="display:flex;gap:9px;margin-top:14px;position:relative">
          <a class="btn" href="${buyUrl(hero)}" target="_blank" rel="noopener" style="flex:1;background:var(--accent-300);color:var(--accent-900);box-shadow:0 4px 0 rgba(32,30,29,.4)">${esc(buyLabel(hero))}</a>
          <button class="btn" data-open="${hero.id}" style="border:1px solid rgba(255,255,255,.3);color:var(--accent-100)">Details</button>
        </div>
      </div>` : `<div style="text-align:center;padding:34px 18px;border:1px dashed var(--n-400);border-radius:26px">
        <div class="disp" style="font-size:18px">No steals on the board</div>
        <p class="muted" style="font-size:12px;margin:8px 0 0">Everything you track is priced at or above market. Refresh prices, or add more to watch.</p>
      </div>`}

      ${list.length > 1 ? `<div style="display:flex;flex-direction:column;gap:9px">${list.slice(1).map(itemRow).join('')}</div>` : ''}
    </div>`;
  }

  function watchScreen() {
    const s = st();
    const ids = Object.keys(s.watch || {});
    const rows = ids.map((id) => ({ it: (s.items || []).find((i) => i.id === id), w: s.watch[id] })).filter((r) => r.it);
    return `<div class="screen">
      <h4 style="margin:6px 0 4px">Watchlist</h4>
      <p class="muted" style="font-size:12.5px">${rows.length} tracked · ${rows.filter((r) => r.it.buy <= r.w.target).length} at target</p>
      ${rows.length ? rows.map(({ it, w }) => {
      const hit = it.buy <= w.target;
      return `<div class="card" style="margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:11px">
            ${art(it, 46)}
            <div style="flex:1;min-width:0">
              <div class="ellip" style="font-size:13.5px;font-weight:700">${esc(it.name)}</div>
              <div class="muted" style="font-size:10.5px;margin-top:2px">Target ${money(w.target)} · market ${money(mv(it))}${w.by ? ' · by ' + esc(w.by) : ''}</div>
            </div>
            <button class="icon-btn" data-unwatch="${it.id}" aria-label="Stop watching" style="background:transparent;color:var(--accent)">${svg(ICON.mark, 19)}</button>
          </div>
          <div class="bar" style="margin-top:12px"><i style="width:${Math.max(6, Math.min(100, (w.target / Math.max(it.buy, 1)) * 100))}%;background:${hit ? 'var(--sage-700)' : 'var(--accent-600)'}"></i></div>
          <div style="display:flex;justify-content:space-between;margin-top:7px;font-size:11px">
            <a href="${buyUrl(it)}" target="_blank" rel="noopener">Now ${money(it.buy)} — open listings</a>
            <b style="color:${hit ? 'var(--sage-700)' : 'var(--accent-700)'}">${hit ? 'Target hit' : money(it.buy - w.target) + ' to go'}</b>
          </div>
        </div>`;
    }).join('')
      : `<div style="text-align:center;padding:34px 18px;border:1px dashed var(--n-400);border-radius:26px;margin-top:14px">
           <div class="disp" style="font-size:18px">Nothing watched yet</div>
           <p class="muted" style="font-size:12px;margin:8px 0 0">Open any item and set a target price.</p>
         </div>`}
    </div>`;
  }

  function chatScreen() {
    const s = st();
    const msgs = s.messages || [];
    const attached = ui.attachItem && (s.items || []).find((i) => i.id === ui.attachItem);
    return `<div class="screen" style="display:flex;flex-direction:column;min-height:calc(100vh - 200px)">
      <div style="display:flex;align-items:baseline;margin:6px 0 12px">
        <h4 style="margin:0">${esc(s.householdName)}</h4>
        <span class="muted" style="font-size:11px;margin-left:auto">${S.signedIn ? 'Private to your household' : 'On this phone until sync is on'}</span>
      </div>
      <div id="chatLog" style="flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:12px">
        ${msgs.length ? msgs.map(bubble).join('')
        : `<div style="text-align:center;padding:34px 18px;border:1px dashed var(--n-400);border-radius:26px">
             <div class="disp" style="font-size:18px">No messages yet</div>
             <p class="muted" style="font-size:12px;margin:8px 0 0">Send a find to each other — tap the clip to attach anything you track.</p>
           </div>`}
      </div>
      ${attached ? `<div style="display:flex;align-items:center;gap:10px;background:var(--accent-100);border-radius:18px;padding:8px 12px;margin-bottom:8px">
        ${art(attached, 30)}
        <div class="ellip" style="flex:1;font-size:12px;font-weight:600">${esc(attached.name)}</div>
        <button class="icon-btn" data-unattach="1" aria-label="Remove attachment" style="width:30px;height:30px;background:transparent">${svg(ICON.x, 14)}</button>
      </div>` : ''}
      <div style="position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:8px 0 10px;background:var(--bg)">
        <button class="icon-btn" data-sheet="attach" aria-label="Attach an item">${svg(ICON.clip, 18)}</button>
        <input class="in" id="msgBox" placeholder="Message ${esc(otherName())}" style="flex:1" autocomplete="off">
        <button class="icon-btn" data-send="1" aria-label="Send" style="background:var(--accent);color:var(--bg)">${svg(ICON.send, 18)}</button>
      </div>
    </div>`;
  }

  function otherName() {
    const names = (st().members || []).map((m) => m.name).filter((n) => n !== meName());
    return names[0] || 'your household';
  }

  function bubble(m) {
    const mine = m.by === meName();
    const item = m.itemId && (st().items || []).find((i) => i.id === m.itemId);
    const when = new Date(m.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return `<div style="display:flex;flex-direction:column;align-items:${mine ? 'flex-end' : 'flex-start'};gap:4px">
      ${mine ? '' : `<div class="muted" style="font-size:10px;padding-left:12px">${esc(m.by)}</div>`}
      <div style="max-width:86%;background:${mine ? 'var(--accent)' : 'var(--surface)'};color:${mine ? 'var(--bg)' : 'var(--text)'};
        border-radius:20px;padding:10px 14px;font-size:13.5px;line-height:1.45">
        ${m.text ? esc(m.text).replace(/\n/g, '<br>') : ''}
        ${item ? `<a href="${buyUrl(item)}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;margin-top:${m.text ? '10px' : '0'};
            background:${mine ? 'rgba(255,255,255,.16)' : 'var(--bg)'};border-radius:16px;padding:9px 11px;text-decoration:none;color:inherit">
            ${art(item, 36)}
            <div style="flex:1;min-width:0">
              <div class="ellip" style="font-size:12px;font-weight:700">${esc(item.name)}</div>
              <div style="font-size:10.5px;opacity:.85">${money(item.buy)} · market ${money(mv(item))}</div>
            </div>${svg(ICON.out, 12)}
          </a>` : ''}
      </div>
      <div class="muted" style="font-size:9.5px;padding:0 12px">${when}</div>
    </div>`;
  }

  function ledgerScreen() {
    const s = st();
    const flips = (s.flips || []).slice().reverse();
    const profit = flips.reduce((a, f) => a + (fees(f.sell) - f.buy - (f.ship || 0)), 0);
    return `<div class="screen">
      <div style="display:flex;align-items:baseline;margin:6px 0 12px">
        <h4 style="margin:0">Flip ledger</h4>
        <button class="btn btn-ghost" data-sheet="flip" style="margin-left:auto">${svg(ICON.plus, 15)} Log a flip</button>
      </div>
      <div class="card" style="display:flex;gap:8px;margin-bottom:14px">
        <div class="stat"><b>${flips.length}</b><span>Flips</span></div>
        <div class="stat"><b style="color:${profit >= 0 ? 'var(--sage-700)' : 'var(--accent-700)'}">${money(profit)}</b><span>Net profit</span></div>
        <div class="stat"><b>${money(flips.length ? profit / flips.length : 0)}</b><span>Per flip</span></div>
      </div>
      ${flips.length ? flips.map((f) => `<div class="row" style="cursor:default;margin-bottom:9px">
        <div style="flex:1;min-width:0">
          <div class="ellip" style="font-size:13px;font-weight:700">${esc(f.name)}</div>
          <div class="muted" style="font-size:10.5px;margin-top:2px">${money(f.buy)} → ${money(f.sell)}${f.ship ? ' · ' + money(f.ship) + ' ship' : ''} · ${esc(f.venue || 'eBay')}${f.by ? ' · ' + esc(f.by) : ''}</div>
        </div>
        <div style="text-align:right;flex:none">
          <div class="disp" style="font-size:16px;color:${fees(f.sell) - f.buy - (f.ship || 0) >= 0 ? 'var(--sage-700)' : 'var(--accent-700)'}">${money(fees(f.sell) - f.buy - (f.ship || 0))}</div>
          <button class="btn btn-ghost" data-delflip="${f.id}" style="font-size:11px;padding:2px 6px;min-height:0">Delete</button>
        </div>
      </div>`).join('')
      : `<div style="text-align:center;padding:34px 18px;border:1px dashed var(--n-400);border-radius:26px">
           <div class="disp" style="font-size:18px">No flips logged</div>
           <p class="muted" style="font-size:12px;margin:8px 0 0">Log what you actually bought and sold — the ledger nets out fees for you.</p>
         </div>`}
    </div>`;
  }

  function youScreen() {
    const s = st();
    return `<div class="screen">
      <div class="card" style="text-align:center">
        <div class="disp" style="font-size:21px">${esc(s.householdName)}</div>
        <div class="muted" style="font-size:11.5px;margin-top:3px">${S.signedIn ? 'Synced' : 'This phone only'}${s.inviteCode ? ' · invite code ' + esc(s.inviteCode) : ''}</div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <div class="stat"><b>${(s.items || []).length}</b><span>Tracked</span></div>
          <div class="stat"><b>${Object.keys(s.watch || {}).length}</b><span>Watched</span></div>
          <div class="stat"><b>${(s.flips || []).length}</b><span>Flips</span></div>
        </div>
        ${S.signedIn
      ? `<button class="btn btn-secondary btn-block" data-signout="1" style="margin-top:12px">Sign out</button>`
      : `<div style="display:flex;gap:8px;margin-top:12px">
            <button class="btn btn-primary" data-sheet="join" style="flex:1">Join with a code</button>
            <button class="btn btn-secondary" data-sheet="signin" style="flex:1">Sign in by email</button>
          </div>`}
      </div>

      <div class="card" style="margin-top:12px">
        <label class="f">Your name in this household</label>
        <input class="in" id="meName" value="${esc(meName())}" placeholder="Riley">
        <div class="muted" style="font-size:10.5px;margin-top:6px">Shown on your chat messages and the flips you log.</div>
      </div>

      <h4 style="margin:22px 0 10px">Selling assumptions</h4>
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="flex:1">
            <div style="font-size:12.5px;font-weight:700">Subtract marketplace fees</div>
            <div class="muted" style="font-size:10.5px">13.25% + $0.30 on sold comps</div>
          </div>
          <button class="switch" data-togglefees="1" role="switch" aria-checked="${!!s.settings.fees}"><i></i></button>
        </div>
        <div style="border-top:1px solid var(--divider);margin-top:12px;padding-top:12px">
          <label class="f">Margin you want on a flip</label>
          <div class="seg">
            ${[20, 30, 40, 50].map((v) => `<button data-margin="${v}" aria-pressed="${(s.settings.targetMargin || 30) === v}">${v}%</button>`).join('')}
          </div>
          <div class="muted" style="font-size:10.5px;margin-top:6px">Drives the “pay no more than” number on every item.</div>
        </div>
        <div style="border-top:1px solid var(--divider);margin-top:12px;padding-top:12px">
          <label class="f">Where you usually buy</label>
          <select class="in" id="venue">
            ${D.SOURCES.map((v) => `<option value="${v.key}" ${s.settings.venue === v.key ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}
          </select>
        </div>
      </div>

      <h4 style="margin:22px 0 10px">More</h4>
      <div class="card">
        <button class="linkrow" data-tab="ledger" style="width:100%;border:0;background:transparent;cursor:pointer">
          ${svg(ICON.book, 19)}<span style="flex:1;text-align:left;font-size:13px;font-weight:600">Flip ledger</span>${svg(ICON.out, 14)}
        </button>
        <button class="linkrow" data-repair="1" style="width:100%;border:0;background:transparent;cursor:pointer;border-top:1px solid var(--divider)">
          ${svg(ICON.check, 19)}<span style="flex:1;text-align:left;font-size:13px;font-weight:600">Repair my data</span>
        </button>
        <button class="linkrow" data-reset="1" style="width:100%;border:0;background:transparent;cursor:pointer;border-top:1px solid var(--divider);color:var(--accent-700)">
          ${svg(ICON.refresh, 19)}<span style="flex:1;text-align:left;font-size:13px;font-weight:600">Reset this phone to the starter catalog</span>
        </button>
      </div>
      <p class="muted" style="font-size:10.5px;margin-top:14px">Market values are recent sold medians. Refresh an item to pull live listings and its real photo.</p>
    </div>`;
  }

  // ---------- detail ----------
  function detailSheet() {
    const it = (st().items || []).find((i) => i.id === ui.detail);
    if (!it) return '';
    const g = grade(it);
    const cs = comps(it);
    const n = netOf(it);
    const w = (st().watch || {})[it.id];
    const listings = it.listings || [];
    const [plabel, pbg, pfg] = platOf(it);
    return sheet(`
      <div style="display:flex;align-items:center;gap:13px">
        ${art(it, 74, 20)}
        <div style="min-width:0;flex:1">
          <div class="disp" style="font-size:20px">${esc(it.name)}</div>
          <div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap">
            <span class="tag tag-plat" style="background:${pbg};color:${pfg}">${esc(plabel)}</span>
            <span class="tag">${esc(condLabel(it.cond))}</span>
            <span class="tag ${it.era === 'retro' ? 'tag-sage' : 'tag-accent'}">${it.era === 'retro' ? 'Retro' : 'Current'}</span>
            <span class="tag">${esc(regionOf(it))}</span>
          </div>
        </div>
      </div>

      <div class="cab" style="margin-top:14px">
        <span class="scan"></span>
        <div style="display:flex;align-items:flex-end;gap:16px;position:relative">
          <div>
            <div class="kicker">Market value</div>
            <div class="disp" style="font-size:30px">${money(mv(it))}</div>
            <div style="font-size:10.5px;color:var(--accent-300)">${it.refreshedAt ? (it.estimated ? 'live asking median' : 'live sold median') : 'recent sold median'}${it.liveCount ? ' · ' + it.liveCount + ' listings' : ''}</div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div class="kicker">Best price now</div>
            <div class="disp" style="font-size:24px;color:var(--sage-300)">${money(it.buy)}</div>
            <div class="stamp ${g.cls}" style="margin-top:6px">${esc(g.label)}</div>
          </div>
        </div>
        <div style="margin-top:14px;position:relative">${eq(trend(it), true)}</div>
        ${it.tiers ? `<div style="display:flex;gap:8px;margin-top:13px;position:relative">
          <div class="stat"><b>${money(it.tiers.loose)}</b><span>Loose</span></div>
          <div class="stat"><b>${money(it.tiers.cib)}</b><span>CIB</span></div>
          <div class="stat"><b>${money(it.tiers.sealed)}</b><span>Sealed</span></div>
        </div>` : ''}
        <div style="display:flex;align-items:center;gap:10px;margin-top:13px;position:relative;background:rgba(255,255,255,.1);border-radius:16px;padding:11px 13px">
          <div style="flex:1">
            <div class="kicker">Pay no more than</div>
            <div class="disp" style="font-size:24px;margin-top:3px">${money(maxBuy(it))}</div>
          </div>
          <div style="text-align:right;font-size:10.5px;color:var(--accent-300);max-width:44%">to clear ${targetMargin()}% after fees and ${money(ship(it))} shipping</div>
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;position:relative">
          <div class="stat"><b>${money(Math.min(...cs.map((c) => c.price)))}–${money(Math.max(...cs.map((c) => c.price)))}</b><span>Sold range</span></div>
          <div class="stat"><b style="color:${n.net >= 0 ? 'var(--sage-300)' : 'var(--accent-300)'}">${money(n.net)}</b><span>Net if flipped</span></div>
          <div class="stat"><b>${Math.round(n.pct)}%</b><span>Return</span></div>
        </div>
      </div>

      ${(() => { const p = sellPlan(it); return `<div class="cab cab-sage" style="margin-top:12px">
        <span class="scan"></span><span class="glow"></span>
        <div style="display:flex;align-items:flex-end;gap:16px;position:relative">
          <div>
            <div class="kicker">List it at</div>
            <div class="disp" style="font-size:28px">${money(p.list)}</div>
            <div style="font-size:10.5px;color:var(--sage-300)">a touch over median, room for offers</div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div class="kicker">You keep</div>
            <div class="disp" style="font-size:22px">${money(p.net)}</div>
            <div style="font-size:10.5px;color:var(--sage-300)">after fees + ${money(ship(it))} ship</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:13px;position:relative">
          <div class="stat"><b>${p.v}/wk</b><span>Sell rate</span></div>
          <div class="stat"><b>~${p.days}d</b><span>To sell</span></div>
          <div class="stat"><b>${p.t >= 0 ? '+' : ''}${Math.round(p.t)}%</b><span>90-day trend</span></div>
        </div>
        <div style="margin-top:12px;font-size:12px;font-weight:700;position:relative;color:${p.t > 4 ? 'var(--sage-300)' : p.t < -4 ? 'var(--accent-300)' : 'rgba(255,255,255,.75)'}">${esc(p.verdict.txt)}</div>
        <div style="display:flex;gap:9px;margin-top:13px;position:relative">
          <button class="btn" data-copytitle="${it.id}" style="flex:1;background:rgba(255,255,255,.16);color:var(--sage-100);border:0">Copy listing title</button>
          <a class="btn" href="https://www.ebay.com/sl/sell" target="_blank" rel="noopener" style="background:var(--sage-300);color:var(--sage-800)">Sell on eBay</a>
        </div>
      </div>`; })()}

      <h4 style="margin:20px 0 6px">Recently sold</h4>
      <div class="card" style="padding:6px 15px">
        ${cs.map((c) => `<div class="sold">
          <div class="disp" style="font-size:16px;width:74px">${money(c.price)}</div>
          <div style="flex:1;min-width:0"><div style="font-size:11.5px;font-weight:600">${esc(condLabel(c.cond))}</div>
          <div class="muted" style="font-size:10px">${esc(c.venue)}</div></div>
          <div class="muted" style="font-size:10.5px">${c.days}d ago</div>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <a class="btn btn-secondary" href="${D.soldComps(it.name)}" target="_blank" rel="noopener" style="flex:1;font-size:12.5px">All sold comps ${svg(ICON.out, 13)}</a>
        <a class="btn btn-secondary" href="${D.priceCharting(it.name)}" target="_blank" rel="noopener" style="flex:1;font-size:12.5px">PriceCharting ${svg(ICON.out, 13)}</a>
      </div>

      ${listings.length ? `<h4 style="margin:22px 0 8px">Cheapest right now ${it.estimated ? '' : ''}</h4>
      <a class="row" href="${esc(listings[0].url)}" target="_blank" rel="noopener" style="text-decoration:none;background:var(--accent-100);margin-bottom:10px">
        ${listings[0].image ? `<div class="art" style="width:58px;height:58px;background:#fff"><img src="${esc(listings[0].image)}" alt="" style="object-fit:contain;padding:3px"></div>` : art(it, 58)}
        <div style="flex:1;min-width:0">
          <div class="ellip" style="font-size:12.5px;font-weight:700">${esc(listings[0].title || it.name)}</div>
          <div class="muted" style="font-size:10.5px;margin-top:2px">${esc(listings[0].condition || condLabel(it.cond))} · tap to open this exact listing</div>
        </div>
        <div style="text-align:right;flex:none">
          <div class="disp" style="font-size:18px">${money(listings[0].landed || listings[0].price)}</div>
          <div class="stamp stamp-good" style="margin-top:4px;font-size:9.5px;padding:3px 8px">${Math.round(((mv(it) - (listings[0].landed || listings[0].price)) / mv(it)) * 100)}% off</div>
        </div>
      </a>
      <h4 style="margin:16px 0 8px">Other live listings</h4>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${listings.slice(1, 7).map((l) => `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener" style="text-decoration:none">
          ${l.image ? `<div class="art" style="width:54px;height:54px"><img src="${esc(l.image)}" alt="" loading="lazy"></div>` : art(it, 54)}
          <div style="flex:1;min-width:0">
            <div class="ellip" style="font-size:12.5px;font-weight:600">${esc(l.title || it.name)}</div>
            <div class="muted" style="font-size:10.5px;margin-top:2px">${esc(l.condition || condLabel(it.cond))}${l.landed && l.landed !== l.price ? ' · ' + money(l.landed) + ' landed' : ''}</div>
          </div>
          <div style="text-align:right;flex:none">
            <div class="disp" style="font-size:16px">${money(l.landed || l.price)}</div>
            <div style="font-size:10px;color:${(l.landed || l.price) < mv(it) ? 'var(--sage-700)' : 'var(--n-600)'}">${Math.round(((mv(it) - (l.landed || l.price)) / mv(it)) * 100)}% off market</div>
          </div>
        </a>`).join('')}
      </div>` : `<div style="margin-top:20px;padding:14px 16px;border-radius:22px;border:1px dashed var(--n-400);display:flex;align-items:center;gap:11px">
        <div style="flex:1;font-size:12px" class="muted">Refresh to pull live listings with photos and link straight to the cheapest one.</div>
        <button class="btn btn-secondary" data-refresh="${it.id}" style="font-size:12.5px">${svg(ICON.refresh, 15)} Refresh</button>
      </div>`}

      <h4 style="margin:22px 0 8px">Where to look</h4>
      <div class="card" style="padding:4px 15px">
        ${D.SOURCES.map((v) => `<a class="linkrow" href="${v.url(it.name)}" target="_blank" rel="noopener" style="border-top:1px solid var(--divider)">
          <span class="tag ${v.kind === 'retail' ? 'tag-sage' : 'tag-accent'}" style="font-size:9.5px">${v.kind}</span>
          <span style="flex:1;font-size:12.5px;font-weight:600">${esc(v.name)}</span>${svg(ICON.out, 14)}
        </a>`).join('')}
      </div>

      <h4 style="margin:22px 0 8px">Alert me</h4>
      <div class="card">
        <label class="f">Tell me when it drops under</label>
        <div style="display:flex;gap:9px">
          <input class="in" id="targetBox" inputmode="numeric" placeholder="${Math.round(mv(it) * 0.8)}" value="${w ? w.target : ''}" style="flex:1">

  // ---------- sheets ----------

      ${foot && foot.length ? `<div class="sheet-foot">${foot.join('')}</div>` : ''}

  }

  function addSheet() {

      <div style="display:flex;gap:9px;margin-top:10px">
        <div style="flex:1"><label class="f">Condition</label><select class="in" id="addCond">

  function attachSheet() {
