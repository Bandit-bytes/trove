  function scanSheet() {
    const r = scan.result;
    const live = !!scanStream;
    const fake = r && { id: 'scan', name: (r.market && r.market.title) || r.query, kind: scan.kind, cond: scan.cond, sell: r.soldMedian || 0 };
    return sheet(`<h4 style="margin:0 0 4px">Scan a barcode</h4>
      <p class="muted" style="font-size:12.5px">Point at the barcode on the box or case. Works on sealed and boxed games — loose carts have no barcode, so type those in.</p>

      <div id="scanView" style="position:relative;margin-top:12px;aspect-ratio:4/3;border-radius:24px;overflow:hidden;
        background:linear-gradient(155deg,#402310,#2b1a11);display:grid;place-items:center">
        ${live ? `<div style="position:absolute;inset:0;pointer-events:none">
            <div style="position:absolute;inset:16% 10%;border-radius:16px;box-shadow:0 0 0 2000px rgba(20,12,8,.42)"></div>
            <div style="position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--accent-300);opacity:.9"></div>
          </div>`
        : `<div style="text-align:center;padding:22px;position:relative">
            <div style="color:var(--accent-300)">${svg(ICON.scan, 34)}</div>
            <div class="kicker" style="margin-top:10px;color:var(--accent-300)">${scan.err ? 'Camera off' : 'Camera is off'}</div>
            <button class="btn" data-scanstart="1" style="margin-top:12px;background:var(--accent-300);color:var(--accent-900)">Turn on the camera</button>
          </div>`}
      </div>

      ${live ? `<div class="kicker" style="margin-top:9px">${scan.engine === 'native' ? 'Scanner running · hold the barcode steady in the frame'
        : scan.engine === 'zxing' ? 'Scanner running (fallback reader) · hold steady'
        : 'Starting the scanner…'}</div>` : ''}
      ${scan.err ? `<div class="card" style="margin-top:10px;background:var(--accent-100)">
          <div style="font-size:12.5px;font-weight:700;color:var(--accent-800)">${esc(scan.err)}</div>
          <button class="btn btn-secondary" data-sheet="quick" style="margin-top:10px;font-size:12.5px">Search by title instead</button>
        </div>` : ''}

      <div style="display:flex;gap:9px;margin-top:10px">
        <select class="in" id="scanKind" style="flex:1">
          <option value="game" ${scan.kind === 'game' ? 'selected' : ''}>Game</option>
          <option value="console" ${scan.kind === 'console' ? 'selected' : ''}>Console</option>
          <option value="handheld" ${scan.kind === 'handheld' ? 'selected' : ''}>Handheld</option>
          <option value="accessory" ${scan.kind === 'accessory' ? 'selected' : ''}>Accessory</option>
        </select>
        <select class="in" id="scanCond" style="flex:1">
          <option value="loose" ${scan.cond === 'loose' ? 'selected' : ''}>Loose</option>
          <option value="used" ${scan.cond === 'used' ? 'selected' : ''}>Used</option>
          <option value="cib" ${scan.cond === 'cib' ? 'selected' : ''}>CIB</option>
          <option value="sealed" ${scan.cond === 'sealed' ? 'selected' : ''}>Sealed</option>
        </select>
      </div>

      <div style="display:flex;gap:9px;margin-top:9px">
        <input class="in" id="scanManual" inputmode="numeric" placeholder="Or type the barcode digits" style="flex:1" autocomplete="off">
        <button class="btn btn-secondary" data-scanmanual="1">Look up</button>
      </div>

      ${scan.busy ? `<div class="card" style="margin-top:14px;text-align:center">
          <div class="disp" style="font-size:16px">Reading ${esc(scan.code || '')}…</div>
          <p class="muted" style="font-size:11.5px;margin:6px 0 0">Pulling the market value</p>
        </div>` : ''}

      ${r ? `<div class="cab" style="margin-top:14px">
        <span class="scan"></span>
        <div style="position:relative">
          <div style="display:flex;align-items:center;gap:12px">
            ${r.image ? `<div class="art" style="width:56px;height:56px;background:#fff;flex:none"><img src="${esc(r.image)}" alt="" style="object-fit:contain;padding:3px"></div>` : ''}
            <div style="min-width:0">
              <div class="disp" style="font-size:17px">${esc((r.market && r.market.title) || r.query)}</div>
              <div class="kicker" style="margin-top:4px">${esc((r.market && r.market.console) || '')}${r.code ? ' · ' + esc(r.code) : ''}</div>
              ${r.resolvedFrom ? `<div style="font-size:10.5px;color:var(--accent-300);margin-top:3px">barcode matched “${esc(r.resolvedFrom)}”</div>` : ''}
            </div>
          </div>
          ${r.stale ? `<div class="kicker" style="margin-top:10px;color:var(--accent-300)">No signal — last checked ${ago(r.cachedAt)}</div>` : ''}
          <div style="display:flex;align-items:flex-end;gap:16px;margin-top:14px">
            <div><div class="kicker">Market now</div><div class="disp" style="font-size:28px">${money(r.soldMedian)}</div></div>
            <div style="margin-left:auto;text-align:right"><div class="kicker">Pay no more than</div><div class="disp" style="font-size:24px;color:var(--sage-300)">${money(maxBuy(fake))}</div></div>
          </div>
          ${r.tiers ? `<div style="display:flex;gap:8px;margin-top:13px">
            <div class="stat"><b>${money(r.tiers.loose)}</b><span>Loose</span></div>
            <div class="stat"><b>${money(r.tiers.cib)}</b><span>CIB</span></div>
            <div class="stat"><b>${money(r.tiers.sealed)}</b><span>Sealed</span></div>
          </div>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-sage" data-scantrack="1" style="flex:1">Track this</button>
        <button class="btn btn-secondary" data-scanhaul="1">Add to haul</button>
        <button class="btn btn-secondary" data-scannext="1">Next</button>
      </div>` : ''}

      ${scan.log.length ? `<div style="display:flex;align-items:baseline;margin:20px 0 8px">
        <h4 style="margin:0">Scanned</h4>
        <button class="btn btn-ghost" data-scanlogclear="1" style="margin-left:auto;font-size:11.5px">Clear</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${scan.log.map((h, i) => `<div class="row" style="cursor:default;min-height:60px">
          ${h.image ? `<div class="art" style="width:38px;height:38px;background:#fff;flex:none"><img src="${esc(h.image)}" alt="" style="object-fit:contain;padding:3px"></div>` : ''}
          <div style="flex:1;min-width:0">
            <div class="ellip" style="font-size:12.5px;font-weight:700">${esc(h.name)}</div>
            <div class="muted" style="font-size:10.5px;margin-top:2px">${money(h.market)} · ${esc(condLabel(h.cond))} · ${esc(h.code)}</div>
          </div>
          <button class="btn btn-ghost" data-scanloghaul="${i}" style="font-size:11.5px;flex:none">+ Haul</button>
        </div>`).join('')}
      </div>` : ''}`,
      [`<button class="btn btn-secondary" data-close="1" style="flex:1">Done</button>`]);
  }

  function haulTotalsHtml() {
    const t = haulTotals();
    const verdict = !t.ask
      ? { col: 'var(--accent-100)', txt: 'Put in what they\'re asking for each piece to get the offer.' }
      : t.ask <= t.max
        ? { col: 'var(--sage-300)', txt: 'Buy it — ' + money(t.max - t.ask) + ' below your walk-away number.' }
        : { col: 'var(--accent-300)', txt: 'Offer ' + money(t.max) + ' for the lot. Walk above that.' };
    return `<div class="cab" style="margin-top:14px">
        <span class="scan"></span>
        <div style="position:relative">
          <div class="kicker">${haul.length} piece${haul.length > 1 ? 's' : ''} in the pile</div>
          <div style="display:flex;align-items:flex-end;gap:16px;margin-top:10px">
            <div><div class="kicker">Lot is worth</div><div class="disp" style="font-size:28px">${money(t.market)}</div></div>
            <div style="margin-left:auto;text-align:right"><div class="kicker">Pay no more than</div><div class="disp" style="font-size:24px;color:var(--sage-300)">${money(t.max)}</div></div>
          </div>
          ${t.ask ? `<div style="display:flex;gap:8px;margin-top:13px">
            <div class="stat"><b>${money(t.ask)}</b><span>They want</span></div>
            <div class="stat"><b>${money(t.net)}</b><span>Net after fees</span></div>
            <div class="stat"><b style="color:${t.profit >= 0 ? 'var(--sage-300)' : 'var(--accent-300)'}">${money(t.profit)}</b><span>Profit</span></div>
          </div>` : ''}
          <div style="margin-top:13px;font-size:12.5px;font-weight:700;color:${verdict.col}">${esc(verdict.txt)}</div>
        </div>
      </div>`;
  }

  function haulSheet() {
    const rows = haul.map((h, i) => `<div class="row" style="cursor:default">
      ${h.image ? `<div class="art" style="width:40px;height:40px;background:#fff;flex:none"><img src="${esc(h.image)}" alt="" style="object-fit:contain;padding:3px"></div>` : ''}
      <div style="flex:1;min-width:0">
        <div class="ellip" style="font-size:12.5px;font-weight:700">${esc(h.name)}</div>
        <div class="muted" style="font-size:10.5px;margin-top:2px">Market ${money(h.market)} · pay ≤ ${money(h.max)}</div>
      </div>
      <input class="in" id="haulAsk${i}" data-haulask="${i}" inputmode="numeric" placeholder="ask"
        value="${h.ask || ''}" style="width:64px;flex:none;text-align:right;padding:7px 8px">
      <button class="icon-btn" data-haulrm="${i}" aria-label="Remove" style="width:32px;height:32px;background:transparent;flex:none">${svg(ICON.x, 14)}</button>
    </div>`).join('');

    return sheet(`<h4 style="margin:0 0 4px">Price the whole pile</h4>
      <p class="muted" style="font-size:12.5px">Box lot, table, estate sale bin — add everything, and Trove totals what it's worth and the most the lot is worth paying.</p>
      <div style="display:flex;gap:9px;margin-top:10px">
        <input class="in" id="haulBox" placeholder="Add — e.g. Chrono Trigger SNES" style="flex:1" autocomplete="off">
        <button class="btn btn-primary" data-hauladd="1">Add</button>
      </div>
      <div style="display:flex;gap:9px;margin-top:9px">
        <select class="in" id="haulKind" style="flex:1">
          <option value="game">Game</option><option value="console">Console</option>
          <option value="handheld">Handheld</option><option value="accessory">Accessory</option>
        </select>
        <select class="in" id="haulCond" style="flex:1">
          <option value="loose">Loose</option><option value="used" selected>Used</option>
          <option value="cib">CIB</option><option value="sealed">Sealed</option>
        </select>
        <select class="in" id="haulRegion" style="flex:1">
          <option value="en">US / EN</option><option value="jp">Japanese</option>
        </select>
      </div>

      ${haul.length ? `<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">${rows}</div>

      <div id="haulTotals">${haulTotalsHtml()}</div>`
      : `<div style="text-align:center;padding:30px 18px;border:1px dashed var(--n-400);border-radius:26px;margin-top:14px">
           <div class="disp" style="font-size:17px">Nothing in the pile yet</div>
           <p class="muted" style="font-size:12px;margin:8px 0 0">Add pieces one by one — the totals update as you go.</p>
         </div>`}`,
      haul.length
        ? [`<button class="btn btn-secondary" data-haulclear="1">Clear</button>`,
          `<button class="btn btn-sage" data-haultrack="1" style="flex:1">Track all ${haul.length}</button>`]
        : [`<button class="btn btn-secondary" data-close="1" style="flex:1">Done</button>`]);
  }

  // ---------- render ----------
  let rafId = null, rafT = null, painted = {}, lastType = 0, bgT = null;
  const FIELDS = 'input[id],textarea[id],select[id]';

  // A background price or photo landing must never eat a half-typed name.
  function snapFields() {
    const edited = {};
    document.querySelectorAll(FIELDS).forEach((el) => {
      if (el.type === 'file') return;
      if (painted[el.id] !== undefined && el.value !== painted[el.id]) edited[el.id] = el.value;
    });
    const act = document.activeElement;
    const focus = act && act.id && /^(INPUT|TEXTAREA|SELECT)$/.test(act.tagName)
      ? { id: act.id, s: act.selectionStart, e: act.selectionEnd } : null;
    return { edited, focus };
  }
  function restoreFields(snap) {
    const next = {};
    document.querySelectorAll(FIELDS).forEach((el) => {
      if (el.type === 'file') return;
      const before = painted[el.id];
      // Only put the typed value back when the repaint didn't deliberately change it.
      if (snap.edited[el.id] !== undefined && (before === undefined || before === el.value)) el.value = snap.edited[el.id];
      next[el.id] = el.value;
    });
    painted = next;
    if (snap.focus) {
      const el = $(snap.focus.id);
      if (!el) return;
      if (el !== document.activeElement) el.focus({ preventScroll: true });
      if (snap.focus.s != null) { try { el.setSelectionRange(snap.focus.s, snap.focus.e); } catch (err) {} }
    }
  }
  const isTyping = () => {
    const act = document.activeElement;
    return !!act && /^(INPUT|TEXTAREA)$/.test(act.tagName) && Date.now() - lastType < 1500;
  };
  // Sync, photos and price refreshes wait for a pause instead of yanking the screen.
  function renderBg() {
    if (isTyping()) { clearTimeout(bgT); bgT = setTimeout(renderBg, 700); return; }
    render();
  }

  function render() {
    if (rafId) return;
    const run = () => {
      if (!rafId) return;
      clearTimeout(rafT);
      cancelAnimationFrame(rafId);
      rafId = null;
      const m = $('main');
      const sc = m ? m.scrollTop : 0;
      const sb = document.querySelector('.sheet-body');
      const ssc = sb ? sb.scrollTop : 0;
      const snap = snapFields();
      paintGuarded();
      const m2 = $('main');
      if (m2 && sc) m2.scrollTop = sc;
      const sb2 = document.querySelector('.sheet-body');
      if (sb2 && ssc) sb2.scrollTop = ssc;
      restoreFields(snap);
    };
    rafId = requestAnimationFrame(run) || -1;
    rafT = setTimeout(run, 120);   // rAF never fires in a backgrounded tab
  }

  function paintGuarded() {
    try { paint(); }
    catch (err) {
      console.error(err);
      $('main').innerHTML = `<div class="card" style="margin-top:14px">

        <button class="btn btn-secondary" data-reset="1" style="margin-top:8px">Start fresh on this phone</button>
      </div>`;
    }
  }

  // ---------- sheet gestures ----------
  function wireSheet() {
    const back = document.querySelector('.sheet-back');
    const sh = back && back.querySelector('.sheet');
    if (!sh || sh.dataset.wired) return;
    sh.dataset.wired = '1';
    const body = sh.querySelector('.sheet-body');
    let startY = null, dy = 0;
    const start = (y, target) => {
      if (body.scrollTop > 3 && !target.closest('.grab')) return;
      startY = y; dy = 0; sh.style.transition = 'none';
    };
    const move = (y) => { if (startY == null) return; dy = y - startY; if (dy > 0) sh.style.transform = 'translateY(' + dy + 'px)'; };
    const end = () => {
      if (startY == null) return;
      sh.style.transition = 'transform .22s cubic-bezier(.2,.9,.3,1)';
      if (dy > 90) { sh.style.transform = 'translateY(100%)'; setTimeout(() => setUI({ sheet: null, detail: null }), 170); }
      else sh.style.transform = '';
      startY = null; dy = 0;
    };
    sh.addEventListener('touchstart', (e) => start(e.touches[0].clientY, e.target), { passive: true });
    sh.addEventListener('touchmove', (e) => move(e.touches[0].clientY), { passive: true });
    sh.addEventListener('touchend', end);
    sh.addEventListener('touchcancel', end);
    sh.addEventListener('mousedown', (e) => start(e.clientY, e.target));
    window.addEventListener('mousemove', (e) => { if (startY != null) move(e.clientY); });
    window.addEventListener('mouseup', end);
  }

  // ---------- photos ----------
  function readPhoto(file, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 420, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

      const i = parseInt(e.target.dataset.haulask, 10);
      if (!haul[i]) return;
      haul[i].ask = parseFloat(e.target.value) || 0;
      saveHaul();
      clearTimeout(haulT);
      haulT = setTimeout(() => {                      // totals only — the rows keep their carets
        const box = $('haulTotals');
        if (box) box.innerHTML = haulTotalsHtml();
      }, 160);
      return;
    }
    if (e.target.id === 'searchBox') {
      ui.q = e.target.value; ui.qFocus = true;
      clearTimeout(qT); qT = setTimeout(paintResults, 130);
      return;
    }
    if (e.target.id === 'msgBox') { ui.draft = e.target.value; return; }
    if (e.target.id === 'meName') { setMe(e.target.value.trim() || 'Me'); return; }
  });

  document.addEventListener('change', (e) => {
    const photoId = e.target.dataset.photo;
    if (photoId && e.target.files && e.target.files[0]) {
      readPhoto(e.target.files[0], (dataUrl) => {
        S.update((s) => { const it = s.items.find((i) => i.id === photoId); if (it) it.image = dataUrl; });
        toast('Photo saved');
      });
      return;
    }
    if (e.target.id === 'venue') { S.update((s) => { s.settings.venue = e.target.value; }); }
    if (e.target.id === 'quickCond') { ui.quickCond = e.target.value; }
    if (e.target.id === 'quickKind') { ui.quickKind = e.target.value; }
    if (e.target.id === 'quickRegion') { ui.quickRegion = e.target.value; }
    if (e.target.id === 'scanKind') { scan.kind = e.target.value; }
    if (e.target.id === 'scanCond') { scan.cond = e.target.value; if (scan.code) { const c = scan.code; scan.code = null; onCode(c); } }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && (ui.sheet || ui.detail)) setUI({ sheet: null, detail: null });
    if (e.key === 'Enter' && e.target.id === 'scanManual') {
      e.preventDefault();
      const btn = document.querySelector('[data-scanmanual]');
      if (btn) btn.click();
      return;
    }
    if (e.key === 'Enter' && (e.target.id === 'haulBox' || e.target.id === 'quickBox')) {
      e.preventDefault();
      const btn = document.querySelector(e.target.id === 'haulBox' ? '[data-hauladd]' : '[data-lookup]');
      if (btn) btn.click();
      return;
    }
    if (e.key === 'Enter' && e.target.id === 'msgBox') {
      e.preventDefault();
      const btn = document.querySelector('[data-send]');
      if (btn) btn.click();
    }
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden && scanStream) { stopScan(); render(); } });
  window.addEventListener('pagehide', () => stopScan());

  S.on(renderBg);
  render();

  // Real product photos arrive on their own; live prices follow if configured.
  S.autoArt().catch(() => {});
  setTimeout(() => S.refreshStale(false).catch(() => {}), 3000);   // a few stale items per session
})();

</script>
</body>
