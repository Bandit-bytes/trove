<!-- Trove: stable screen updates -->
<style>
.screen,
.sheet {
  animation: none !important;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>

<script>
(function () {
  'use strict';

  if (window.__troveStableUpdates) return;
  window.__troveStableUpdates = true;

  const descriptor = Object.getOwnPropertyDescriptor(
    Element.prototype,
    'innerHTML'
  );

  if (!descriptor || !descriptor.get || !descriptor.set) return;

  const stableRoots = new Set([
    'top',
    'main',
    'tabs',
    'overlay',
    'resultList',
    'liveCard',
    'refreshBar',
    'haulTotals'
  ]);

  function identity(node) {
    if (node.nodeType !== 1) return null;

    if (node.id) return 'id:' + node.id;

    const attributes = [
      'data-open',
      'data-tab',
      'data-plat',
      'data-kind',
      'data-era',
      'data-region',
      'data-sort',
      'data-haulask',
      'data-unwatch',
      'data-delflip'
    ];

    for (const attribute of attributes) {
      if (node.hasAttribute(attribute)) {
        return node.tagName + ':' + attribute + ':' +
          node.getAttribute(attribute);
      }
    }

    if (node.tagName === 'IMG') {
      return 'image:' + node.getAttribute('src');
    }

    return null;
  }

  function compatible(current, next) {
    if (current.nodeType !== next.nodeType) return false;

    if (current.nodeType === 1) {
      if (current.tagName !== next.tagName) return false;

      const currentKey = identity(current);
      const nextKey = identity(next);

      if (currentKey || nextKey) {
        return currentKey === nextKey;
      }
    }

    return true;
  }

  function updateNode(current, next) {
    if (current.nodeType !== 1) {
      if (current.nodeValue !== next.nodeValue) {
        current.nodeValue = next.nodeValue;
      }
      return;
    }

    const active = document.activeElement === current;
    const preserveValue = active &&
      /^(INPUT|TEXTAREA|SELECT)$/.test(current.tagName);

    const oldValue = preserveValue ? current.value : null;

    for (const attribute of Array.from(current.attributes)) {
      if (!next.hasAttribute(attribute.name)) {
        current.removeAttribute(attribute.name);
      }
    }

    for (const attribute of Array.from(next.attributes)) {
      if (current.getAttribute(attribute.name) !== attribute.value) {
        current.setAttribute(attribute.name, attribute.value);
      }
    }

    // Keep the camera video attached while scanning.
    if (current.id === 'scanView') {
      const video = current.querySelector('video');

      if (video && !next.querySelector('video')) {
        next.insertBefore(video.cloneNode(false), next.firstChild);
      }
    }

    updateChildren(current, next);

    if (preserveValue) {
      current.value = oldValue;
    } else if (
      current.tagName === 'INPUT' &&
      current.type !== 'file'
    ) {
      current.value = next.value;
      current.checked = next.checked;
    } else if (
      current.tagName === 'TEXTAREA' ||
      current.tagName === 'SELECT'
    ) {
      current.value = next.value;
    }
  }

  function updateChildren(parent, nextParent) {
    let position = parent.firstChild;

    for (const next of Array.from(nextParent.childNodes)) {
      let current = position;

      if (!current || !compatible(current, next)) {
        const key = identity(next);

        if (key) {
          current = Array.from(parent.childNodes).find(function (node) {
            return identity(node) === key &&
              compatible(node, next);
          });
        } else {
          current = null;
        }
      }

      if (current && compatible(current, next)) {
        if (current !== position) {
          parent.insertBefore(current, position);
        }

        updateNode(current, next);
        position = current.nextSibling;
      } else {
        const inserted = next.cloneNode(true);
        parent.insertBefore(inserted, position);
        position = inserted.nextSibling;
      }
    }

    while (position) {
      const remaining = position;
      position = position.nextSibling;
      remaining.remove();
    }
  }

  Object.defineProperty(Element.prototype, 'innerHTML', {
    configurable: descriptor.configurable,
    enumerable: descriptor.enumerable,

    get: descriptor.get,

    set: function (html) {
      if (!stableRoots.has(this.id)) {
        descriptor.set.call(this, html);
        return;
      }

      try {
        const template = document.createElement('template');
        descriptor.set.call(template, html);

        updateChildren(this, template.content);
      } catch (error) {
        console.warn('Trove screen update fallback:', error);
        descriptor.set.call(this, html);
      }
    }
  });
})();
</script>
