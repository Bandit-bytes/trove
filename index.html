          <div class="ellip" style="font-size:12.5px;font-weight:700">${esc(listings[0].title || it.name)}</div>
          <div class="muted" style="font-size:10.5px;margin-top:2px">${esc(listings[0].condition || condLabel(it.cond))} · tap to open this exact listing</div>
        </div>
        <div style="text-align:right;flex:none">
          <div class="disp" style="font-size:18px">${money(listings[0].landed || listings[0].price)}</div>
          <div class="stamp stamp-good" style="margin-top:4px;font-size:9.5px;padding:3px 8px">${mv(it) ? Math.round(((mv(it) - (listings[0].landed || listings[0].price)) / mv(it)) * 100) : 0}% off</div>
        </div>
      </a>
      <h4 style="margin:16px 0 8px">Other live listings</h4>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${listings.slice(1, 7).map((l) => `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener" style="text-decoration:none">
          ${l.image ? `<div class="art" style="width:54px;height:54px"><img src="${esc(l.image)}" alt="" loading="lazy"></div>` : art(it, 54)}
          <div style="flex:1;min-width:0">
            <div class="ellip" style="font-size:12.5px;font-weight:600">${esc(l.title || it.name)}</div>
            <div class="muted" style="font-size:10.5px;margin-top:2px">${esc(l.condition || condLabel(it.cond))}${l.landed && l.landed !== l.price ? ' · ' + money(l.landed) + ' landed' : ''}</div>
          </div>
          <div style="text-align:right;flex:none">
            <div class="disp" style="font-size:16px">${money(l.landed || l.price)}</div>
            <div style="font-size:10px;color:${(l.landed || l.price) < mv(it) ? 'var(--sage-700)' : 'var(--n-600)'}">${mv(it) ? Math.round(((mv(it) - (l.landed || l.price)) / mv(it)) * 100) : 0}% off market</div>
          </div>
        </a>`).join('')}
      </div>` : `<div style="margin-top:20px;padding:14px 16px;border-radius:22px;border:1px dashed var(--n-400);display:flex;align-items:center;gap:11px">
        <div style="flex:1;font-size:12px" class="muted">${busy ? 'Pulling live listings…' : 'No current live listings. Refresh to pull them with photos and a link to the cheapest.'}</div>
        <button class="btn btn-secondary" data-refresh="${it.id}" style="font-size:12.5px">${svg(ICON.refresh, 15)} Refresh</button>
      </div>`}

      <h4 style="margin:22px 0 8px">Where to look</h4>
      <div class="card" style="padding:4px 15px">
        ${D.SOURCES.map((v) => `<a class="linkrow" href="${esc(v.url(it.name))}" target="_blank" rel="noopener" style="border-top:1px solid var(--divider)">
          <span class="tag ${v.kind === 'retail' ? 'tag-sage' : 'tag-accent'}" style="font-size:9.5px">${v.kind}</span>
          <span style="flex:1;font-size:12.5px;font-weight:600">${esc(v.name)}</span>${svg(ICON.out, 14)}
        </a>`).join('')}

          <input type="file" accept="image/*" data-photo="${it.id}" style="display:none"></label>

        <button class="icon-btn" data-tochat="${it.id}" aria-label="Send to chat">${svg(ICON.send, 18)}</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
        <p class="muted" style="font-size:10.5px;flex:1;margin:0">${it.refreshedAt ? (it.marketSource || 'Live') + ' · updated ' + new Date(it.refreshedAt).toLocaleString() : 'Starter estimate — Trove is fetching the live price.'}</p>
        ${it.pcUrl ? `<a href="${esc(it.pcUrl)}" target="_blank" rel="noopener" style="font-size:10.5px;font-weight:700">Price history ${svg(ICON.out, 11)}</a>` : ''}
      </div>
      <button class="btn btn-ghost btn-block" data-remove="${it.id}" style="margin-top:14px;color:var(--accent-700)">Stop tracking this item</button>
    `, [
      `<a class="btn btn-primary" href="${esc(buyUrl(it))}" target="_blank" rel="noopener" style="flex:1">${esc(buyLabel(it))}</a>`,
      `<button class="btn btn-secondary" data-sheet="flip" data-flipitem="${it.id}">Log flip</button>`,
    ]);

  // ---------- sheets ----------

  function scanSheet() {

    const kinds = [['game', 'Game'], ['console', 'Console'], ['handheld', 'Handheld'], ['accessory', 'Accessory']];
    const conds = [['loose', 'Loose'], ['used', 'Used'], ['cib', 'CIB'], ['sealed', 'Sealed']];

    return sheet(`<h4 style="margin:0 0 4px">Scan a barcode</h4>

  let quickSeq = 0, quickT = null, quickAskT = null;
  async function runQuick(explicit) {
    const box = $('quickBox');
    const q = ((box && box.value) || ui.quickQ || '').trim();
    if (!q) { if (explicit) toast('Type what you are looking at'); return; }
    if (ui.quick && ui.quick.query !== q) ui.quickAsk = 0;
    ui.quickQ = q;
    const val = (id, d) => { const el = $(id); return el ? el.value : d; };
    ui.quickCond = val('quickCond', ui.quickCond || 'used');
    ui.quickRegion = val('quickRegion', ui.quickRegion || 'en');
    ui.quickKind = val('quickKind', ui.quickKind || 'game');
    ui.quickPlat = val('quickPlat', ui.quickPlat || '');
    const seq = ++quickSeq;
    ui.quickBusy = true; render();
    try {
      const r = await S.quickLook(q, ui.quickCond, ui.quickRegion, ui.quickKind, ui.quickPlat || null);
      if (seq !== quickSeq) return;
      ui.quick = r;
    } catch (err) {
      if (seq !== quickSeq) return;
      ui.quick = null;
      toast(err.message);
    }
    ui.quickBusy = false;
    render();
  }

  let rafId = null, rafT = null, painted = {}, lastType = 0, bgT = null;
  const FIELDS = 'input[id],textarea[id],select[id]';

  // A background price or photo landing must never eat a half-typed name.
  function snapFields() {
    const edited = {};
    document.querySelectorAll(FIELDS).forEach((el) => {
      if (el.type === 'file') return;
      if (painted[el.id] !== undefined && el.value !== painted[el.id]) edited[el.id] = el.value;
    });
    const act = document.activeElement;
    const focus = act && act.id && /^(INPUT|TEXTAREA|SELECT)$/.test(act.tagName)
      ? { id: act.id, s: act.selectionStart, e: act.selectionEnd } : null;
    return { edited, focus };
  }
  function restoreFields(snap) {
    const next = {};
    document.querySelectorAll(FIELDS).forEach((el) => {
      if (el.type === 'file') return;
      const before = painted[el.id];
      if (snap.edited[el.id] !== undefined && (before === undefined || before === el.value)) el.value = snap.edited[el.id];
      next[el.id] = el.value;
    });
    painted = next;
    if (snap.focus) {
      const el = $(snap.focus.id);
      if (!el) return;
      if (el !== document.activeElement) el.focus({ preventScroll: true });
      if (snap.focus.s != null) { try { el.setSelectionRange(snap.focus.s, snap.focus.e); } catch (err) {} }
    }
  }
  const isTyping = () => {
    const act = document.activeElement;
    return !!act && /^(INPUT|TEXTAREA)$/.test(act.tagName) && Date.now() - lastType < 1500;
  };
  // Sync, photos and price refreshes wait for a pause instead of yanking the screen.
  function renderBg() {
    if (isTyping()) {
      clearTimeout(bgT);

  function render() {
    if (rafId) return;
    const run = () => {
      if (!rafId) return;
      clearTimeout(rafT);
      cancelAnimationFrame(rafId);
      rafId = null;
      const m = $('main');
      const sc = m ? m.scrollTop : 0;
      const nearBot = !!m && ui.tab === 'chat' && (m.scrollHeight - m.scrollTop - m.clientHeight) < 90;
      const sb = document.querySelector('.sheet-body');
      const ssc = sb ? sb.scrollTop : 0;
      const snap = snapFields();
      paintGuarded();
      const m2 = $('main');
      if (m2 && sc) m2.scrollTop = sc;
      const sb2 = document.querySelector('.sheet-body');
      if (sb2 && ssc) sb2.scrollTop = ssc;
      restoreFields(snap);
      if (ui.tab === 'chat' && (ui.chatBottom || nearBot)) {
        const mm = $('main');
        if (mm) mm.scrollTop = mm.scrollHeight;
        ui.chatBottom = false;

    rafId = requestAnimationFrame(run) || -1;

  // ---------- sheet gestures ----------
  function wireSheet() {
    const back = document.querySelector('.sheet-back');
    const sh = back && back.querySelector('.sheet');
    if (!sh || sh.dataset.wired) return;
    sh.dataset.wired = '1';
    const body = sh.querySelector('.sheet-body');
    let startY = null, dy = 0;
    const start = (y, target) => {
      if (body.scrollTop > 3 && !target.closest('.grab')) return;
      startY = y; dy = 0; sh.style.transition = 'none';
    };
    const move = (y) => { if (startY == null) return; dy = y - startY; if (dy > 0) sh.style.transform = 'translateY(' + dy + 'px)'; };
    const end = () => {
      if (startY == null) return;
      sh.style.transition = 'transform .22s cubic-bezier(.2,.9,.3,1)';
      if (dy > 90) { sh.style.transform = 'translateY(100%)'; setTimeout(() => setUI({ sheet: null, detail: null }), 170); }
      else sh.style.transform = '';
      startY = null; dy = 0;
    };
    sh.addEventListener('touchstart', (e) => start(e.touches[0].clientY, e.target), { passive: true });
    sh.addEventListener('touchmove', (e) => move(e.touches[0].clientY), { passive: true });
    sh.addEventListener('touchend', end);
    sh.addEventListener('touchcancel', end);
    sh.addEventListener('mousedown', (e) => start(e.clientY, e.target));
    window.addEventListener('mousemove', (e) => { if (startY != null) move(e.clientY); });
    window.addEventListener('mouseup', end);
  }

  // ---------- photos ----------
  function readPhoto(file, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 420, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

      if (!haul[i]) return;
      haul[i].ask = parseFloat(e.target.value) || 0;
      saveHaul();
      clearTimeout(haulT);
      haulT = setTimeout(() => {
        const box = $('haulTotals');
        if (box) box.innerHTML = haulTotalsHtml();
      }, 160);
      return;
    }
    if (e.target.id === 'searchBox') {
      ui.q = e.target.value; ui.qFocus = true;
      clearTimeout(qT); qT = setTimeout(paintResults, 130);
      scheduleLive();
      return;
    }
    if (e.target.id === 'quickBox') {
      ui.quickQ = e.target.value;
      clearTimeout(quickT);
      if (e.target.value.trim().length >= 3) quickT = setTimeout(() => runQuick(false), 700);
      return;
    }
    if (e.target.id === 'quickAsk') {
      ui.quickAsk = parseFloat(String(e.target.value).replace(/[^0-9.]/g, '')) || 0;
      clearTimeout(quickAskT);
      quickAskT = setTimeout(render, 350);
      return;
    }
    if (e.target.id === 'msgBox') { ui.draft = e.target.value; return; }
  });

  document.addEventListener('focusin', (e) => {
    if (e.target && (e.target.id === 'meName' || e.target.id === 'houseName')) {
      setTimeout(() => { try { e.target.select(); } catch (err) {} }, 0);
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'meName') { setMe(e.target.value.trim() || 'Me'); return; }
    const photoId = e.target.dataset.photo;
    if (photoId && e.target.files && e.target.files[0]) {
      readPhoto(e.target.files[0], (dataUrl) => {
        S.update((s) => { const it = s.items.find((i) => i.id === photoId); if (it) it.image = dataUrl; });
        toast('Photo saved');
      });
      return;
    }
    if (e.target.id === 'venue') { S.update((s) => { s.settings.venue = e.target.value; }); }
    if (/^quick(Cond|Kind|Region|Plat)$/.test(e.target.id)) {
      ui[e.target.id] = e.target.value;
      if ((ui.quickQ || '').trim()) runQuick(false);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && (ui.sheet || ui.detail)) setUI({ sheet: null, detail: null });
    if (e.key !== 'Enter') return;
    const map = { scanManual: '[data-scanmanual]', haulBox: '[data-hauladd]', quickBox: '[data-lookup]',
      msgBox: '[data-send]', askBox: '[data-setask]', targetBox: '[data-watch]' };
    if (e.target.id === 'searchBox') { e.preventDefault(); clearTimeout(liveT); runLive(); e.target.blur(); return; }
    const sel = map[e.target.id];
    if (!sel) return;
    e.preventDefault();
    const btn = document.querySelector(sel);
    if (btn) btn.click();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (scanStream) { stopScan(); render(); } return; }
    autoRefresh();
  });
  window.addEventListener('online', () => { lastAuto = 0; autoRefresh(); });
  window.addEventListener('pagehide', () => stopScan());

  S.on(renderBg);
  S.on(notifyNew);
  S.on(checkTargets);
  render();

  // Photos are fetched once and kept on the item. Prices are kept fresh on their own.
  S.autoArt().catch(() => {});
  setTimeout(autoRefresh, 2000);
  setInterval(autoRefresh, 15 * 60e3);
})();

</script>
</body>
</html>
