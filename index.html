<style>
:root{
  --bg:#f7ecd9; --bg-2:#f2e2c8; --surface:#fdf7ec; --surface-2:#ebddc5; --text:#201e1d;
  --accent:#c67139; --accent-100:#fff2eb; --accent-200:#ffe1d0; --accent-300:#ffc6a5;
  --accent-500:#c67139; --accent-600:#b2622d; --accent-700:#8c491a; --accent-800:#643312; --accent-900:#402310;
  --sage-100:#f0fae1; --sage-200:#e1eecc; --sage-300:#ccdbb2; --sage-500:#7a8a5e; --sage-600:#728157; --sage-700:#56633f; --sage-800:#3d472b;
  --n-100:#f9f4ed; --n-200:#eee7db; --n-300:#dcd3c4; --n-400:#c0b6a5; --n-600:#82796a; --n-700:#645c50; --n-800:#474238;
  --divider:rgba(32,30,29,.14);
  --shadow-sm:0 1px 2px rgba(46,43,37,.14); --shadow-md:0 4px 14px rgba(46,43,37,.14); --shadow-lg:0 14px 36px rgba(46,43,37,.22);
  --font-h:"Caprasimo",Georgia,serif; --font-b:"Figtree",system-ui,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  background:
    radial-gradient(120% 62% at 88% -8%,rgba(198,113,57,.20),transparent 62%),
    radial-gradient(110% 54% at 4% 4%,rgba(122,138,94,.18),transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:400;line-height:1.1;letter-spacing:-.015em;margin:0 0 8px}
h2{font-size:30px} h3{font-size:23px} h4{font-size:19px}
p{margin:0 0 12px}
a{color:var(--accent-700)} a:hover{color:var(--accent-800)}
button,input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(198,113,57,.3)}
.hide{display:none!important}

#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
header.top{padding:calc(var(--safe-top) + 14px) 18px 8px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--font-h);font-size:24px;line-height:1;display:flex;align-items:center;gap:9px}
.brand i{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;color:#fff2eb;
  background:linear-gradient(160deg,#d9853f,#8c491a);box-shadow:0 3px 0 var(--accent-900),inset 0 1px 0 rgba(255,255,255,.35)}
.kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-700);font-weight:700}
main{flex:1;overflow-y:auto;padding:0 18px calc(112px + var(--safe-bot));-webkit-overflow-scrolling:touch}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:2px;padding:8px 10px calc(10px + var(--safe-bot));
  max-width:520px;margin:0 auto;
  background:linear-gradient(to top,var(--bg-2) 62%,rgba(242,226,200,0))}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0;color:var(--n-600);cursor:pointer;min-height:52px}
nav.tabs button[aria-current="page"]{color:var(--accent-800)}
nav.tabs button[aria-current="page"] .tico{color:#fff2eb;background:linear-gradient(160deg,#d9853f,#a4551f);box-shadow:0 3px 0 var(--accent-900)}
.tico{width:40px;height:27px;border-radius:11px;display:grid;place-items:center;background:transparent}
nav.tabs span{font-size:9.5px;letter-spacing:.04em;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;
  font-family:var(--font-h);font-size:14px;line-height:1.2;color:var(--text);background:transparent;
  border:1px solid transparent;padding:11px 16px;border-radius:999px;min-height:44px}
.btn-primary{background:linear-gradient(160deg,#d9853f,#b2622d);color:#fff6ee;box-shadow:0 4px 0 var(--accent-800)}
.btn-primary:active{box-shadow:0 1px 0 var(--accent-900);transform:translateY(3px)}
.btn-sage{background:linear-gradient(160deg,#8b9c68,#56633f);color:var(--sage-100);box-shadow:0 4px 0 var(--sage-800)}
.btn-sage:active{box-shadow:0 1px 0 var(--sage-800);transform:translateY(3px)}
.btn-secondary{border-color:var(--divider);background:var(--surface)}
.btn-secondary:active{background:var(--n-200)}
.btn-ghost{color:var(--accent-700);padding:8px 10px;min-height:40px}
.btn-block{width:100%}
.btn:disabled{opacity:.45}
.icon-btn{width:44px;height:44px;padding:0;border-radius:14px;background:var(--surface);border:1px solid var(--divider);
  display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm)}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--n-200);color:var(--n-800)}
.tag-accent{background:var(--accent-100);color:var(--accent-800)}
.tag-sage{background:var(--sage-100);color:var(--sage-800)}
.tag-plat{font-family:var(--font-h);font-size:10.5px;padding:3px 9px}
.card{background:var(--surface);border-radius:24px;padding:15px;box-shadow:var(--shadow-sm)}
.cab{border-radius:28px;padding:17px;position:relative;overflow:hidden;color:var(--accent-100);
  background:linear-gradient(155deg,#5a3216 0%,#402310 52%,#2b1a11 100%);
  box-shadow:0 8px 0 rgba(43,26,17,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.cab .kicker{color:var(--accent-300)}
.cab-sage{background:linear-gradient(155deg,#5c6b44 0%,#3d472b 55%,#2a3120 100%);color:var(--sage-100);
  box-shadow:0 8px 0 rgba(42,49,32,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.cab-sage .kicker{color:var(--sage-300)}
.scan{position:absolute;inset:0;pointer-events:none;opacity:.14;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.55) 0 1px,transparent 1px 4px)}
.glow{position:absolute;width:190px;height:190px;border-radius:50%;right:-58px;top:-72px;
  background:radial-gradient(circle,rgba(255,198,165,.34),transparent 68%);pointer-events:none}
.disp{font-family:var(--font-h);line-height:1;letter-spacing:-.02em}
label.f{display:block;font-size:12px;margin-bottom:5px;color:var(--n-700);font-weight:600}
input.in,select.in{width:100%;min-height:46px;padding:8px 16px;background:var(--surface);border:1px solid var(--divider);
  border-radius:999px;caret-color:var(--accent);font-size:16px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:999px;padding:4px 6px 4px 15px;
  box-shadow:0 3px 0 var(--n-300),var(--shadow-sm)}
.search input{flex:1;border:0;background:transparent;min-height:44px;font-size:16px;outline:none}
.seg{display:flex;background:var(--n-200);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(46,43,37,.08)}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;font-size:12.5px;color:var(--n-700);cursor:pointer;border-radius:999px;min-height:42px;font-weight:600}
.seg button[aria-pressed="true"]{background:linear-gradient(160deg,#d9853f,#b2622d);color:#fff6ee;box-shadow:0 2px 0 var(--accent-800)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 18px 12px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--n-400);background:var(--surface);color:var(--n-800);font-size:12px;
  padding:8px 14px;border-radius:999px;cursor:pointer;min-height:38px;white-space:nowrap;font-weight:600}

  // platform key -> how PriceCharting spells that console. Used to keep an English
  // N64 search from coming back with the Japanese release.
  const PC_CONSOLE = {
    switch2: ['nintendo switch 2'], switch: ['nintendo switch'],
    gb: ['gameboy'], gba: ['gameboy advance'], ds: ['nintendo ds'], n3ds: ['nintendo 3ds'],
    nes: ['nes'], snes: ['super nintendo'], n64: ['nintendo 64'], gc: ['gamecube'], wii: ['wii'],
    ps1: ['playstation'], ps2: ['playstation 2'], ps5: ['playstation 5'],
    psp: ['psp'], vita: ['playstation vita'],
    xsx: ['xbox series x', 'xbox one', 'xbox'],
    genesis: ['sega genesis'], saturn: ['sega saturn'], dreamcast: ['sega dreamcast'],

<script>
// Local-first store with optional Supabase sync, plus the live price engine.
// Data shape is one JSON document per household, so two phones stay in step
// without a schema migration every time the app grows.
(function () {
  const CFG = window.TROVE_CONFIG || {};
  const KEY = 'trove.state.v1';
  const listeners = new Set();

  const freshState = () => ({
    v: 1,
    householdName: 'My household',
    inviteCode: null,
    members: [{ id: 'me', name: 'Me', initials: 'ME' }],
    // Seed prices carry no history: a trend is only ever drawn from real readings.
    items: window.TroveData.SEED.map((s) => ({ ...s, history: [] })),
    watch: {},          // itemId -> { target, by }
    flips: [],          // { id, itemId, name, buy, sell, ship, venue, cond, when, by }
    messages: [],       // { id, by, text, itemId, t } — private to the household
    settings: { fees: true, minMargin: 10, venue: 'ebay', sort: 'margin', autoRefresh: true, refreshHours: CFG.REFRESH_HOURS || 6 },
    updatedAt: Date.now(),
  });

  // Anything that arrives from storage or the cloud gets backfilled, so a
  // document written by an older build can never blank the screen.
  function normalize(x) {
    const base = freshState();
    const out = Object.assign({}, base, x || {});
    if (!Array.isArray(out.items) || !out.items.length) out.items = base.items;
    out.items = out.items.filter(Boolean).map((i) => {
      const it = Object.assign({
        id: 'i' + Math.random().toString(36).slice(2, 8), name: 'Untitled', kind: 'handheld',
        cond: 'used', buy: 0, sell: 0, history: [],
      }, i);
      // Never-refreshed items only hold starter guesses — drop the fake first sample.
      if (!it.refreshedAt) it.history = [];
      // Older builds stored live eBay asks without marking them as live.
      if (it.refreshedAt && !it.askAt && Array.isArray(it.listings) && it.listings.length) {
        it.askAt = it.refreshedAt; it.askSrc = 'ebay';
      }
      return it;
    });
    // New catalog entries from a newer build get folded in, and seeded items keep
    // their platform/era metadata up to date — without touching user edits.
    const byId = {};
    out.items.forEach((i) => { byId[i.id] = i; });
    window.TroveData.SEED.forEach((seed) => {
      const existing = byId[seed.id];
      if (!existing) out.items.push(Object.assign({}, seed, { history: [] }));
      else {
        if (!existing.platform) existing.platform = seed.platform;
        if (!existing.era) existing.era = seed.era;
      }
    });
    if (!Array.isArray(out.flips)) out.flips = [];
    if (!Array.isArray(out.messages)) out.messages = [];
    if (!Array.isArray(out.members) || !out.members.length) out.members = base.members;
    if (!out.watch || typeof out.watch !== 'object') out.watch = {};
    out.settings = Object.assign({}, base.settings, out.settings || {});
    if (!out.updatedAt) out.updatedAt = Date.now();
    return out;
  }

  let state = normalize(load());
  let supa = null;
  let householdId = null;
  let channel = null;
  let attaching = false, joining = false;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* corrupted storage — start clean */ }
    return freshState();
  }

  // ---------- saving ----------
  // Things the person does save and repaint at once. Background price work is
  // grouped: it saves, repaints and syncs in small batches instead of per item.
  const emit = () => listeners.forEach((fn) => fn(state));
  const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  let bgDepth = 0, dirty = false;

  function commit(push) {
    dirty = false;
    state.updatedAt = Date.now();
    saveLocal();
    emit();
    if (push && supa && householdId) pushRemote();
  }
  function persist(push = true) { commit(push); }
  function persistBg() {
    state.updatedAt = Date.now();
    if (bgDepth) { dirty = true; return; }
    commit(true);
  }
  function flush() { if (dirty) commit(true); }
  async function batch(fn) {
    bgDepth++;
    try { return await fn(); }
    finally { bgDepth--; if (!bgDepth) flush(); }
  }
  function bgUpdate(mutator) { mutator(state); persistBg(); }

  // ---------- Supabase (optional) ----------
  async function initCloud() {
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) return null;
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    supa = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    const { data } = await supa.auth.getSession();
    if (data.session) await attachHousehold();
    supa.auth.onAuthStateChange((_e, session) => { if (session) attachHousehold(); });
    return supa;
  }

  async function attachHousehold() {
    // Sign-in fires both a direct call and an auth-state event; without this guard the
    // two race and the second one creates a *second* household — which read as "the app reset".
    if (attaching || joining || householdId) return;
    attaching = true;
    try { await attachHouseholdInner(); } finally { attaching = false; }
  }

  async function attachHouseholdInner() {
    const { data: me } = await supa.auth.getUser();
    if (!me.user) return;
    let { data: rows } = await supa.from('memberships').select('household_id').eq('user_id', me.user.id).limit(1);
    if (!rows || !rows.length) {
      const code = 'TROVE-' + Math.random().toString(36).slice(2, 6).toUpperCase();
      const { data: hh } = await supa.from('households')
        .insert({ name: state.householdName, code, data: state }).select().single();
      if (!hh) return;
      await supa.from('memberships').insert({ user_id: me.user.id, household_id: hh.id });
      householdId = hh.id;
      state.inviteCode = code;
      persist(false);
    } else {
      householdId = rows[0].household_id;
      await pullRemote();
    }
    subscribe();
  }

  // Joining a household must never overwrite what is already up there, and must never
  // throw away what is on this phone: both sides get folded together, keyed by id.
  function mergeStates(remote, local) {
    const out = normalize(remote);
    const byId = (arr) => { const m = {}; (arr || []).forEach((x) => { if (x && x.id) m[x.id] = x; }); return m; };
    const rItems = byId(out.items);
    (local.items || []).forEach((i) => {
      const r = rItems[i.id];
      if (!r) out.items.push(i);
      // Keep whichever phone holds the newer price for the same item.
      else if ((i.refreshedAt || 0) > (r.refreshedAt || 0)) Object.assign(r, i);
    });
    const rFlips = byId(out.flips);
    (local.flips || []).forEach((f) => { if (!rFlips[f.id]) out.flips.push(f); });
    const rMsgs = byId(out.messages);
    (local.messages || []).forEach((m) => { if (!rMsgs[m.id]) out.messages.push(m); });
    out.messages.sort((a, b) => (a.t || 0) - (b.t || 0));
    out.messages = out.messages.slice(-300);
    out.watch = Object.assign({}, local.watch || {}, out.watch || {});
    return out;
  }

  async function pullRemote(adopt) {
    const { data } = await supa.from('households').select('data, code, name').eq('id', householdId).single();
    if (!data) return;
    if (data.data && (adopt || data.data.updatedAt > (state.updatedAt || 0))) {
      const merged = adopt ? mergeStates(data.data, state) : normalize(data.data);
      state = normalize(Object.assign({}, merged, { inviteCode: data.code, householdName: data.name }));
      saveLocal();
      emit();
      if (adopt) pushRemote();
    } else {
      state.inviteCode = data.code;
      pushRemote();
    }
  }

  let pushTimer = null;
  function pushRemote() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      try { await supa.from('households').update({ data: state, updated_at: new Date().toISOString() }).eq('id', householdId); }
      catch (e) {}
    }, 900);
  }

  function subscribe() {
    if (!supa || !householdId || channel) return;
    channel = supa.channel('hh:' + householdId)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'households', filter: 'id=eq.' + householdId },
        (payload) => {
          const remote = payload.new && payload.new.data;
          if (remote && remote.updatedAt > state.updatedAt) {
            // A push from the other phone must not wipe anything this phone has added
            // since — fold, don't replace.
            state = mergeStates(remote, state);
            saveLocal();
            emit();
          }
        })
      .subscribe();
  }

  // ---------- Keyless market data (PriceCharting through a CORS proxy) ----------
  const PROXIES = [
    (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    (u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
    (u) => 'https://api.cors.lol/?url=' + encodeURIComponent(u),
    (u) => 'https://proxy.cors.sh/' + u,
  ];
  const PROXY_KEY = 'trove.proxy';
  let bestProxy = (() => {
    const n = parseInt(localStorage.getItem(PROXY_KEY) || '0', 10);
    return n >= 0 && n < PROXIES.length ? n : 0;
  })();

  // Lookups are cached so a public proxy never gets hammered; a stale copy is kept
  // as a fallback for bad signal at a flea market.
  const MKT_KEY = 'trove.market.v1';
  const MKT_TTL = 3 * 3600e3;
  const mktCache = (() => { try { return JSON.parse(localStorage.getItem(MKT_KEY) || '{}'); } catch (e) { return {}; } })();
  const cacheGet = (k) => {
    const hit = mktCache[k];
    return hit && Date.now() - hit.t < MKT_TTL ? hit.v : null;
  };
  const cacheAny = (k) => mktCache[k] || null;
  let cacheSaveT = null;
  const cachePut = (k, v) => {
    mktCache[k] = { t: Date.now(), v };
    const keys = Object.keys(mktCache);
    if (keys.length > 400) delete mktCache[keys[0]];
    clearTimeout(cacheSaveT);
    cacheSaveT = setTimeout(() => { try { localStorage.setItem(MKT_KEY, JSON.stringify(mktCache)); } catch (e) {} }, 400);
  };

  // Hedged requests: the proxy that answered last time goes first. If it hasn't
  // answered within 1.2 s the next one joins the race, and so on. The first good
  // answer wins and every other request is cancelled. Worst case drops from
  // two full sequential passes (~2 min) to about 14 s.
  async function viaProxy(url, ms) {
    const limit = ms || 9000;
    const order = [bestProxy].concat(PROXIES.map((_, i) => i).filter((i) => i !== bestProxy));
    const ctls = [], timers = [];
    let finished = false;
    const attempt = (i, wait) => new Promise((resolve, reject) => {
      timers.push(setTimeout(async () => {
        if (finished) return reject(new Error('cancelled'));
        const c = new AbortController(); ctls.push(c);
        const kill = setTimeout(() => c.abort(), limit);
        try {
          const res = await fetch(PROXIES[i](url), { signal: c.signal });
          if (!res.ok) throw new Error('proxy ' + res.status);
          const text = await res.text();
          if (text.length < 2000) throw new Error('empty response');
          resolve({ text, i });
        } catch (e) { reject(e); }
        finally { clearTimeout(kill); }
      }, wait));
    });
    try {
      const win = await Promise.any(order.map((i, k) => attempt(i, k * 1200)));
      if (win.i !== bestProxy) { bestProxy = win.i; try { localStorage.setItem(PROXY_KEY, String(win.i)); } catch (e) {} }
      return win.text;
    } catch (e) {
      throw new Error('Could not reach the price source just now — check your signal and try again');
    } finally {
      finished = true;
      timers.forEach(clearTimeout);
      ctls.forEach((c) => { try { c.abort(); } catch (e) {} });
    }
  }

  const num = (s2) => parseFloat(String(s2).replace(/[^0-9.]/g, '')) || 0;

  function parsePC(html) {
    const rows = [];
    const body = html.slice(html.indexOf('games_table'));
    const chunks = body.split('<tr id="product-').slice(1);
    for (const c of chunks.slice(0, 30)) {
      const img = (c.match(/src="(https:\/\/storage\.googleapis\.com\/images\.pricecharting\.com\/[^"]+)"/) || [])[1] || null;
      const link = (c.match(/href="(https:\/\/www\.pricecharting\.com\/game\/[^"]+)"/) || [])[1] || null;
      const titleBlock = c.slice(c.indexOf('<td class="title"'));
      const title = ((titleBlock.match(/>\s*([^<>]{2,120}?)\s*<\/a>/) || [])[1] || '').trim();
      const console_ = ((titleBlock.match(/console-in-title[\s\S]{0,180}?>\s*([^<>]{2,60}?)\s*<\/a>/) || [])[1] || '').trim();
      const prices = (c.match(/js-price">\s*\$?([0-9,]+\.[0-9]{2})/g) || []).map(num);
      if (!title || !prices.length) continue;
      rows.push({
        title, console: console_, url: link, image: img ? img.replace(/\/60\.jpg$/, '/240.jpg') : null,
        loose: prices[0] || 0, cib: prices[1] || 0, sealed: prices[2] || 0,
      });
    }
    return rows;
  }

  const tokens = (s2) => String(s2).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter((w) => w.length > 1);
  const isUpc = (q) => /^\d{8,14}$/.test(String(q).trim());

  // PriceCharting prefixes foreign releases: "JP Nintendo 64", "PAL Gamecube".
  const isJP = (r) => /^\s*(jp|japan)\b/i.test(r.console || '') || /\bjapan(ese)?\b/i.test(r.console || '');
  const isPAL = (r) => /^\s*pal\b/i.test(r.console || '');
  const bareConsole = (r) => String(r.console || '').toLowerCase().replace(/^\s*(jp|pal|japan)\s+/i, '').trim();
  const pcNames = (platform) => ((window.TroveData && window.TroveData.PC_CONSOLE) || {})[platform] || [];

  // Region and platform are hard constraints, not hints.
  function narrow(rows, region, platform) {
    const note = { droppedRegion: 0, droppedPlatform: 0, regionOnlyOther: false, platformMiss: false };
    let out = rows;
    if (region === 'jp') {
      const jp = out.filter(isJP);
      if (jp.length) out = jp; else note.regionOnlyOther = true;
    } else if (region === 'pal') {
      const pal = out.filter(isPAL);
      if (pal.length) out = pal; else note.regionOnlyOther = true;
    } else {
      const en = out.filter((r) => !isJP(r) && !isPAL(r));
      note.droppedRegion = out.length - en.length;
      if (en.length) out = en; else note.regionOnlyOther = true;
    }
    const names = pcNames(platform);
    if (names.length) {
      const hit = out.filter((r) => names.some((n) => bareConsole(r).includes(n)));
      if (hit.length) { note.droppedPlatform = out.length - hit.length; out = hit; }
      else note.platformMiss = true;
    }
    return { rows: out, note };
  }

  // Rank candidates against what the user actually typed, so "Nintendo 64"
  // returns the console and not the best-selling game on it.
  function pickRow(rows, region, query, kind) {
    if (!rows.length) return null;
    if (isUpc(query)) return rows[0];
    const want = tokens(query);
    const hardware = kind && kind !== 'game';
    const scored = rows.map((r) => {
      const have = tokens(r.title + ' ' + r.console);
      let sc = want.filter((w) => have.includes(w)).length * 3;
      if (tokens(r.title).join(' ') === want.join(' ')) sc += 8;
      if (tokens(r.title).join(' ').indexOf(want.join(' ')) === 0) sc += 3;
      if (hardware && /system|console|handheld/i.test(r.title)) sc += 5;
      if (!hardware && /system|console/i.test(r.title)) sc -= 4;
      if (/\b(pin|poster|guide|strategy|soundtrack|promo|demo|not for resale)\b/i.test(r.title)) sc -= 6;
      return { r, sc };
    }).sort((a, b) => b.sc - a.sc);
    return scored[0].r;
  }

  // A barcode means nothing to a price database — turn it into a product title first.
  // Barcode → title never changes, so it is cached for good.
  async function upcTitle(code) {
    const ck = 'upc|' + code;
    const known = cacheAny(ck);
    if (known && known.v) return known.v;
    const url = 'https://api.upcitemdb.com/prod/trial/lookup?upc=' + encodeURIComponent(code);
    const parse = (txt) => {
      try {
        const j = JSON.parse(txt);
        const it = (j.items || [])[0];
        return (it && (it.title || it.brand)) || null;
      } catch (e) { return null; }
    };
    let t = null;
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(9000) });
      if (res.ok) t = parse(await res.text());
    } catch (e) {}
    if (!t) { try { t = parse(await viaProxy(url, 9000)); } catch (e) { t = null; } }
    if (t) cachePut(ck, t);
    return t;
  }

  // Which tier a condition sells at.
  function pickTier(r, cond, era) {
    if (!r) return 0;
    return cond === 'sealed' ? (r.sealed || r.cib || r.loose)
      : cond === 'new' ? (era === 'current' ? (r.cib || r.loose) : (r.sealed || r.cib || r.loose))
        : cond === 'cib' ? (r.cib || r.loose) : (r.loose || r.cib);
  }

  const mkey = (query, region, kind, platform) =>
    (region || 'en') + '|' + (kind || '') + '|' + (platform || '') + '|' + String(query).toLowerCase().trim();

  async function doLookup(key, query, region, kind, platform) {
    let q = query, resolved = null;
    if (isUpc(q)) {
      resolved = await upcTitle(q);
      if (resolved) q = resolved.replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
    }
    if (!isUpc(q)) {
      // Naming the console in the query is what makes PriceCharting return the right
      // release instead of whatever sells best under that title.
      const names = pcNames(platform);
      if (names.length && !new RegExp(names[0].replace(/\s+/g, '\\s*'), 'i').test(q)) q += ' ' + names[0];
      if (region === 'jp' && !/jp|japan/i.test(q)) q += ' JP';
      if (region === 'pal' && !/pal/i.test(q)) q += ' PAL';
      if (kind && kind !== 'game' && kind !== 'accessory' && !/system|console/i.test(q)) q += ' system';
    }
    const url = 'https://www.pricecharting.com/search-products?q=' + encodeURIComponent(q) + '&type=prices';
    const old = cacheAny(key);
    let html;
    try { html = await viaProxy(url); }
    catch (err) {
      if (old) return Object.assign({}, old.v, { stale: true, cachedAt: old.t });
      throw err;
    }
    const all = parsePC(html);
    const { rows, note } = narrow(all, region || 'en', platform);
    const row = pickRow(rows, region, resolved || query, kind);
    if (!row) {
      if (old) return Object.assign({}, old.v, { stale: true, cachedAt: old.t });
      throw new Error(isUpc(query)
        ? (resolved
          ? 'Found “' + resolved + '”, but it has no price listing — search the title instead'
          : 'That barcode isn’t in any product database — type the title instead')
        : 'No market data found for “' + query + '” — try the exact title');
    }
    const out = { row, rows: rows.slice(0, 8), resolvedFrom: resolved, note, searchedAs: q };
    cachePut(key, out);
    return out;
  }

  // Identical lookups that are already on their way share one request.
  const inflight = new Map();
  function marketLookup(query, region, kind, platform, opts) {
    const o = opts || {};
    const key = mkey(query, region, kind, platform);
    if (!o.fresh) { const hit = cacheGet(key); if (hit) return Promise.resolve(hit); }
    if (inflight.has(key)) return inflight.get(key);
    const p = doLookup(key, query, region, kind, platform).finally(() => inflight.delete(key));
    inflight.set(key, p);
    return p;
  }
  // Instant answer from cache (any age) while the live one is fetched.
  function peekMarket(query, region, kind, platform) {
    const h = cacheAny(mkey(query, region, kind, platform));
    if (!h || !h.v || !h.v.row) return null;
    return Object.assign({}, h.v, { stale: Date.now() - h.t > MKT_TTL, cachedAt: h.t });
  }

  // ---------- eBay asking prices (your Supabase function) ----------
  const ebayMem = new Map(), ebayFly = new Map();
  function ebayLookup(query, condition) {
    if (!CFG.PRICES_ENDPOINT) return Promise.resolve(null);
    const key = (condition || 'used') + '|' + String(query).toLowerCase().trim();
    const hit = ebayMem.get(key);
    if (hit && Date.now() - hit.t < 15 * 60e3) return Promise.resolve(hit.v);
    if (ebayFly.has(key)) return ebayFly.get(key);
    const p = (async () => {
      let res;
      try {
        res = await fetch(CFG.PRICES_ENDPOINT, {
          method: 'POST',
          signal: AbortSignal.timeout(12000),
          headers: { 'content-type': 'application/json', ...(CFG.SUPABASE_ANON_KEY ? { authorization: 'Bearer ' + CFG.SUPABASE_ANON_KEY } : {}) },
          body: JSON.stringify({ query, condition: condition || 'used' }),
        });
      } catch (e) { throw new Error('eBay price service unreachable'); }
      let out = null;
      try { out = await res.json(); } catch (e) {}
      if (!res.ok || !out || out.error) throw new Error((out && out.error) || 'eBay price service returned ' + res.status);
      ebayMem.set(key, { t: Date.now(), v: out });
      return out;
    })().finally(() => ebayFly.delete(key));
    ebayFly.set(key, p);
    return p;
  }

  let staleRun = null;

  // ---------- Public API ----------
  const Store = {
    get state() { return state; },
    get cloudReady() { return !!supa; },
    get signedIn() { return !!householdId; },
    on(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    update(mutator) { mutator(state); persist(); },
    reset() { state = freshState(); persist(); },
    repair() { state = normalize(state); persist(); },

    async signIn(email) {
      if (!supa) await initCloud();
      if (!supa) throw new Error('Cloud sync is not configured yet — see README.');
      const { error } = await supa.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href } });
      if (error) throw error;
    },
    // 6-digit code sign-in: works entirely inside the installed app, so the
    // magic link never has to bounce through Safari.
    async verifyCode(email, code) {
      if (!supa) await initCloud();
      if (!supa) throw new Error('Cloud sync is not configured yet — see README.');
      const { error } = await supa.auth.verifyOtp({ email: email.trim(), token: code.trim(), type: 'email' });
      if (error) throw error;
      await attachHousehold();
    },
    async signOut() { if (supa) await supa.auth.signOut(); householdId = null; },

    async joinHousehold(code) {
      if (!supa) await initCloud();
      if (!supa) throw new Error('Cloud sync is not configured yet — see README.');
      joining = true;
      try {
        let { data: me } = await supa.auth.getUser();
        if (!me || !me.user) {
          // No email needed: a code holder joins as an anonymous member of the household.
          const { data: anon, error: anonErr } = await supa.auth.signInAnonymously();
          if (anonErr || !anon || !anon.user) {
            throw new Error('Turn on “Allow anonymous sign-ins” in Supabase → Authentication → Sign In / Providers, then try the code again.');
          }
          me = { user: anon.user };
        }
        const { data: hh } = await supa.from('households').select('id').eq('code', code.trim().toUpperCase()).single();
        if (!hh) throw new Error('No household with that code.');
        await supa.from('memberships').upsert({ user_id: me.user.id, household_id: hh.id });
        householdId = hh.id;
        await pullRemote(true);   // adopt + merge, never blank either side
        subscribe();
      } finally { joining = false; }
    },

    marketLookup,
    peekMarket,
    pickTier,
    priceError: null,

    // Market value and eBay asking price are fetched at the same time, then written
    // in one save — not two sequential round trips and two saves.
    async refreshPrice(item, opts) {
      const o = opts || {};
      const write = o.bg ? bgUpdate : Store.update;
      const [m, e] = await Promise.allSettled([
        marketLookup(item.name, item.region, item.kind, item.platform, { fresh: o.fresh }),
        ebayLookup(item.name, item.cond),
      ]);
      const market = m.status === 'fulfilled' ? m.value : null;
      const ebay = e.status === 'fulfilled' ? e.value : null;
      if (CFG.PRICES_ENDPOINT) Store.priceError = e.status === 'rejected' ? ((e.reason && e.reason.message) || 'eBay price service unreachable') : null;

      if (!market && !ebay) {
        write((s) => { const it = s.items.find((i) => i.id === item.id); if (it) it.lastFailAt = Date.now(); });
        throw (m.reason || new Error('No price data'));
      }

      write((s) => {
        const it = s.items.find((i) => i.id === item.id);
        if (!it) return;
        const now = Date.now();
        let fresh = false;
        if (market) {
          const r = market.row;
          it.tiers = { loose: r.loose, cib: r.cib, sealed: r.sealed };
          const pick = pickTier(r, it.cond, it.era);
          if (pick) it.sell = Math.round(pick);
          if (r.image && !it.image) it.autoImage = r.image;
          if (r.console) it.pcConsole = r.console;
          it.pcUrl = r.url;
          it.marketSource = 'PriceCharting';
          it.matchNote = market.note || null;
          it.pcMatch = r.title + (r.console ? ' · ' + r.console : '');
          it.estimated = false;
          if (!market.stale) fresh = true;
        }
        if (ebay) {
          // A price the person typed in from the table in front of them beats an
          // online listing for a day.
          const keepTyped = it.askSrc === 'you' && it.askAt && now - it.askAt < 86400e3;
          if (ebay.lowestBuy && !keepTyped) { it.buy = Math.round(ebay.lowestBuy); it.askAt = now; it.askSrc = 'ebay'; }
          if (ebay.soldMedian && (!market || !ebay.soldMedianIsEstimate)) {
            if (!market) { it.sell = Math.round(ebay.soldMedian); it.estimated = !!ebay.soldMedianIsEstimate; it.marketSource = 'eBay'; }
          }
          it.listings = ebay.listings || [];
          const best = it.listings[0];
          if (best) {
            it.bestUrl = best.url;
            it.bestPrice = Math.round(best.landed || best.price);
            if (!it.image && !it.autoImage && best.image) it.autoImage = best.image;
          }
          if (ebay.count) it.liveCount = ebay.count;
          if (ebay.soldWk) it.soldWk = ebay.soldWk;
          fresh = true;
        }
        if (fresh) { it.refreshedAt = now; delete it.lastFailAt; }
        // Real samples only, one per day — the trend line has to be measured, not drawn.
        const hist = (it.history || []).filter((h) => h && h.sell);
        const last = hist[hist.length - 1];
        if (fresh && it.sell) {
          if (!last || now - last.t > 20 * 3600e3) hist.push({ t: now, buy: it.buy, sell: it.sell });
          else { last.sell = it.sell; last.buy = it.buy; last.t = now; }
        }
        it.history = hist.slice(-120);
      });
      return { market: market && market.row, ebay, askUnavailable: !ebay };
    },

    // ---- Real product photos, no API key: Wikipedia's search + pageimages.
    async fetchArt(item) {
      const clean = item.name.replace(/\(.*?\)/g, ' ').replace(/\b(cib|loose|sealed|used|console)\b/gi, ' ').replace(/\s+/g, ' ').trim();
      const url = 'https://en.wikipedia.org/w/api.php?action=query&generator=search'
        + '&gsrsearch=' + encodeURIComponent(clean) + '&gsrlimit=1&prop=pageimages&piprop=thumbnail'
        + '&pithumbsize=420&format=json&origin=*';
      const res = await fetch(url);
      if (!res.ok) throw new Error('art lookup failed');
      const j = await res.json();
      const pages = (j.query && j.query.pages) || {};
      const first = Object.keys(pages).map((k) => pages[k])[0];
      const thumb = first && first.thumbnail && first.thumbnail.source;
      bgUpdate((st2) => {
        const it = st2.items.find((i) => i.id === item.id);
        if (!it) return;
        it.artTried = true;
        if (thumb && !it.autoImage) it.autoImage = thumb;
      });
      return thumb || null;
    },

    // Fill in missing artwork in the background, a few at a time.
    async autoArt() {
      const todo = state.items.filter((i) => !i.image && !i.autoImage && !i.artTried);
      if (!todo.length) return 0;
      await batch(async () => {
        for (let k = 0; k < todo.length; k += 4) {
          await Promise.all(todo.slice(k, k + 4).map((it) => Store.fetchArt(it).catch(() => {
            bgUpdate((st2) => { const x = st2.items.find((i) => i.id === it.id); if (x) x.artTried = true; });
          })));
          flush();
        }
      });
      return todo.length;
    },

    // Price anything by name without adding it to the catalog.
    // Market value and the eBay ask are requested in parallel.
    async quickLook(query, condition, region, kind, platform, opts) {
      const o = opts || {};
      const [m, e] = await Promise.allSettled([
        marketLookup(query, region, kind, platform),
        o.marketOnly ? Promise.resolve(null) : ebayLookup(query, condition || 'used'),
      ]);
      if (m.status === 'rejected') throw m.reason;
      const mk = m.value, r = mk.row;
      const ebay = e.status === 'fulfilled' ? e.value : null;
      if (!o.marketOnly && CFG.PRICES_ENDPOINT) {
        Store.priceError = e.status === 'rejected' ? ((e.reason && e.reason.message) || 'eBay price service unreachable') : null;
      }
      const out = {
        query, market: r, tiers: { loose: r.loose, cib: r.cib, sealed: r.sealed },
        soldMedian: pickTier(r, condition) || (ebay && ebay.soldMedian) || 0,
        image: r.image, pcUrl: r.url, listings: [], lowestBuy: 0, askUnknown: true,
        stale: mk.stale, cachedAt: mk.cachedAt, resolvedFrom: mk.resolvedFrom,
        note: mk.note || null, alts: (mk.rows || []).slice(0, 6), searchedAs: mk.searchedAs,
        platform: platform || null, region: region || 'en',
      };
      if (ebay) {
        out.listings = ebay.listings || [];
        out.lowestBuy = ebay.lowestBuy || 0;
        out.askUnknown = !ebay.lowestBuy;
        out.liveCount = ebay.count || 0;
        if (!out.image && ebay.image) out.image = ebay.image;
      }
      return out;
    },

    // Items whose price is older than the person's freshness window. Items that
    // just failed are left alone for 20 minutes so a dead source isn't hammered.
    staleItems() {
      const hrs = state.settings.refreshHours || CFG.REFRESH_HOURS || 6;
      const now = Date.now(), maxAge = hrs * 3600e3;
      return state.items.filter((i) => (!i.refreshedAt || now - i.refreshedAt > maxAge)
        && !(i.lastFailAt && now - i.lastFailAt < 20 * 60e3));
    },

    // Re-check prices with a small worker pool: watched items first, then oldest.
    // The screen and the cloud copy update every few items, not every item.
    refreshStale(opts, onProgress) {
      if (staleRun) return staleRun;
      const o = opts || {};
      const w = state.watch || {};
      let due = (o.all ? state.items.slice() : Store.staleItems())
        .sort((a, b) => (w[a.id] ? 0 : 1) - (w[b.id] ? 0 : 1) || (a.refreshedAt || 0) - (b.refreshedAt || 0));
      if (o.limit) due = due.slice(0, o.limit);
      const total = due.length;
      let done = 0, ok = 0;
      if (!total) return Promise.resolve(0);
      staleRun = batch(async () => {
        const queue = due.slice();
        const worker = async () => {
          while (queue.length) {
            const it = queue.shift();
            try { await Store.refreshPrice(it, { bg: true, fresh: !!o.all }); ok++; } catch (e) {}
            done++;
            if (onProgress) onProgress(done, total);
            if (done % 3 === 0) flush();
          }
        };
        await Promise.all(Array.from({ length: Math.min(3, total) }, worker));
        return ok;
      }).finally(() => { staleRun = null; });
      return staleRun;
    },

    get pricesOn() { return !!CFG.PRICES_ENDPOINT; },
    get marketOn() { return true; },
    removeItem(id) { Store.update((s2) => { s2.items = s2.items.filter((i) => i.id !== id); delete s2.watch[id]; }); },

    initCloud,
    batch,
  };

  window.TroveStore = Store;
  initCloud().catch(() => {});
})();

</script>
<script>
// Trove — UI layer. Check what anything is worth, decide buy or pass, hunt and flip.
(function () {
  const S = window.TroveStore;
  const D = window.TroveData;
  const CFG = window.TROVE_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  const st = () => S.state;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => '$' + Math.round(n || 0).toLocaleString();
  const uid = () => 'x' + Math.random().toString(36).slice(2, 9);
  const ago = (t) => {
    const m = Math.round((Date.now() - (t || 0)) / 60000);
    if (m < 60) return Math.max(1, m) + ' min ago';
    const h = Math.round(m / 60);
    return h < 24 ? h + ' hr ago' : Math.round(h / 24) + ' days ago';
  };
  const platOf = (it) => D.PLATFORMS[it.platform] || D.PLATFORMS.multi;
  const regionOf = (it) => (it.region === 'jp' ? 'Japan' : it.region === 'pal' ? 'PAL' : 'US / EN');
  const condLabel = (k) => (D.CONDS.find((c) => c.key === k) || { label: 'Used' }).label;

  const ICON = {
    search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>',
    zap: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
    mark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
    chat: '<path d="M8 12h8"/><path d="M8 8h5"/><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    out: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    refresh: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
    send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    clip: '<path d="m21 8-9.5 9.5a4 4 0 0 1-5.7-5.7L14 4a2.7 2.7 0 0 1 3.8 3.8L9.4 16.2a1.3 1.3 0 0 1-1.9-1.9L15 7"/>',
    chart: '<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    box: '<path d="m21 8-9 4-9-4 9-4z"/><path d="M3 8v8l9 4 9-4V8"/><path d="M12 12v8"/>',
    scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8"/><path d="M11 8v8"/><path d="M15 8v8"/>',
  };
  const svg = (p, n = 21) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

  const ME_KEY = 'trove.me';
  const meName = () => localStorage.getItem(ME_KEY) || 'Me';
  const setMe = (n) => { localStorage.setItem(ME_KEY, n); render(); };
  const SEEN_KEY = 'trove.seen';
  const lastSeen = () => parseInt(localStorage.getItem(SEEN_KEY) || '0', 10);
  const markSeen = () => localStorage.setItem(SEEN_KEY, String(Date.now()));

  // ---------- notifications (messages + watch targets) ----------
  const NOTIF_KEY = 'trove.notify';
  const NOTIF_AT = 'trove.notify.at';
  const notifOn = () => localStorage.getItem(NOTIF_KEY) === '1';
  const notifSupported = () => typeof Notification !== 'undefined';
  const notifBlocked = () => notifSupported() && Notification.permission === 'denied';
  const notifAt = () => parseInt(localStorage.getItem(NOTIF_AT) || String(Date.now()), 10);
  const canNotify = () => notifOn() && notifSupported() && Notification.permission === 'granted';

  async function enableNotifs() {
    if (!notifSupported()) return toast('This browser can’t show notifications');
    let perm = Notification.permission;
    if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch (e) { perm = 'denied'; } }
    if (perm !== 'granted') { render(); return toast('Notifications are blocked in your browser settings'); }
    localStorage.setItem(NOTIF_KEY, '1');
    localStorage.setItem(NOTIF_AT, String(Date.now()));
    render(); toast('Notifications on');
  }
  function disableNotifs() {
    localStorage.setItem(NOTIF_KEY, '0');
    render(); toast('Notifications off');
  }

  function notifyNew() {
    if (!canNotify()) return;
    const since = notifAt();
    const mine = meName();
    const fresh = (st().messages || []).filter((m) => m.t > since && m.by !== mine);
    if (!fresh.length) return;
    localStorage.setItem(NOTIF_AT, String(Math.max(...fresh.map((m) => m.t))));
    const reading = ui.tab === 'chat' && !document.hidden;
    if (reading) return;
    const last = fresh[fresh.length - 1];
    const body = fresh.length > 1 ? fresh.length + ' new messages · ' + (last.text || 'shared an item')
      : (last.text || 'shared an item');
    try {
      const n = new Notification('Trove — ' + last.by, { body, tag: 'trove-chat', icon: 'icon-192.png' });
      n.onclick = () => { try { window.focus(); } catch (e) {} setUI({ tab: 'chat', sheet: null, detail: null }); markSeen(); n.close(); };
    } catch (e) {}
  }

  // When a live asking price drops to a watch target, say so once per price.
  const ALERT_KEY = 'trove.alerted';
  function checkTargets() {
    const s = st();
    let seen;
    try { seen = JSON.parse(localStorage.getItem(ALERT_KEY) || '{}'); } catch (e) { seen = {}; }
    const hits = [];
    Object.keys(s.watch || {}).forEach((id) => {
      const it = (s.items || []).find((i) => i.id === id);
      const w = s.watch[id];
      if (!it || !w || !hasAsk(it) || it.buy > w.target) return;
      const k = id + ':' + it.buy;
      if (seen[id] === k) return;
      seen[id] = k;
      hits.push(it);
    });
    if (!hits.length) return;
    try { localStorage.setItem(ALERT_KEY, JSON.stringify(seen)); } catch (e) {}
    const msg = hits.length === 1 ? hits[0].name + ' hit your target — ' + money(hits[0].buy)
      : hits.length + ' watched items hit their targets';
    setTimeout(() => toast(msg), 50);
    if (canNotify()) {
      try {
        const n = new Notification('Trove — target hit', { body: msg, tag: 'trove-target', icon: 'icon-192.png' });
        n.onclick = () => { try { window.focus(); } catch (e) {} setUI({ tab: 'watch', sheet: null, detail: null }); n.close(); };
      } catch (e) {}
    }
  }

  let ui = { tab: 'browse', q: '', plat: 'all', kind: 'all', era: 'all', region: 'all', sort: 'steal', detail: null, sheet: null, attachItem: null, draft: '', authEmail: '' };
  let toastT = null, qT = null, haulT = null;

  function setUI(patch) {
    if (patch.tab === 'chat' && ui.tab !== 'chat') ui.chatBottom = true;
    Object.assign(ui, patch); render();
  }
  // Toasts live outside the overlay so a repaint can't wipe them mid-message.
  function toast(msg) {
    clearTimeout(toastT);
    $('toastHost').innerHTML = `<div class="toast" id="toast">${esc(msg)}</div>`;
    toastT = setTimeout(() => { $('toastHost').innerHTML = ''; }, 2800);
  }

  // ---------- freshness ----------
  const refreshHrs = () => st().settings.refreshHours || CFG.REFRESH_HOURS || 6;
  function freshness(it) {
    if (!it.refreshedAt) return { fresh: false, label: 'starter estimate' };
    return Date.now() - it.refreshedAt < refreshHrs() * 3600e3
      ? { fresh: true, label: 'checked ' + ago(it.refreshedAt) }
      : { fresh: false, label: 'out of date · ' + ago(it.refreshedAt) };
  }
  const fdot = (f) => `<span class="fdot" style="background:${f.fresh ? 'var(--sage-600)' : 'var(--accent-500)'}"></span>`;

  // An asking price only counts while it's recent: online asks for 2 days,
  // a price you typed in from the table for 7.
  const ASK_LIFE = { ebay: 2 * 86400e3, you: 7 * 86400e3 };
  function hasAsk(it) {
    return !!it && it.buy > 0 && !!it.askAt && Date.now() - it.askAt < (ASK_LIFE[it.askSrc] || ASK_LIFE.ebay);
  }
  const askLabel = (it) => (it.askSrc === 'you' ? 'you entered ' + ago(it.askAt) : 'eBay · ' + ago(it.askAt));
  const tierFor = (r, cond) => S.pickTier(r, cond);

  // ---------- money helpers ----------
  function fees(n) { return st().settings.fees ? n * 0.8675 - 0.3 : n; }
  function mv(it) { return it.sell || 0; }                       // market value = recent sold median
  function deal(it) {                                            // how far under market the live ask is
    const m = mv(it); if (!m || !hasAsk(it)) return 0;
    return (m - it.buy) / m;
  }
  function netOf(it) { const net = fees(mv(it)) - it.buy; return { net, pct: it.buy ? (net / it.buy) * 100 : 0 }; }
  function gap(it) { return hasAsk(it) ? Math.max(0, mv(it) - it.buy) : 0; }
  function grade(it) {
    if (!hasAsk(it)) return { cls: 'stamp-fair', label: it.buy ? 'Ask out of date' : 'No ask yet' };
    const d = deal(it) * 100;
    if (d >= 38) return { cls: 'stamp-steal', label: 'Steal ' + Math.round(d) + '% off' };
    if (d >= 25) return { cls: 'stamp-good', label: Math.round(d) + '% under market' };
    if (d >= 0) return { cls: 'stamp-fair', label: 'At market' };
    return { cls: 'stamp-over', label: Math.round(-d) + '% over market' };
  }

  // ---------- real numbers only ----------
  const SHIP = { game: 5, accessory: 6, handheld: 12, console: 18 };
  function ship(it) { return SHIP[it.kind] || 10; }

  function samples(it) {
    return (it.history || []).filter((h) => h && h.sell > 0).sort((a, b) => a.t - b.t);
  }
  function histTrend(it) {
    const h = samples(it);
    if (h.length < 2) return null;
    const first = h[0], last = h[h.length - 1];
    if (!first.sell) return null;
    const days = Math.max(1, Math.round((last.t - first.t) / 86400e3));
    return { pct: ((last.sell - first.sell) / first.sell) * 100, days, n: h.length };
  }
  function targetMargin() { return st().settings.targetMargin || 30; }
  function maxBuy(it) {
    const m = mv(it);
    return Math.max(0, Math.round(fees(m) - ship(it) - (m * targetMargin()) / 100));
  }

  function sellPlan(it) {
    const m = mv(it);
    const list = Math.round(m * 1.06);          // list a touch over median, expect offers
    const fee = Math.round(m - fees(m));
    const sh = ship(it);
    const net = Math.round(fees(m) - sh);
    const t = histTrend(it);
    return { list, fee, ship: sh, net, t };
  }

  function spark(it) {
    const h = samples(it);
    if (h.length < 2) return '';
    const vals = h.slice(-14).map((x) => x.sell);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    return `<div class="eq eqd">${vals.map((v, i) =>
      `<i style="height:${Math.max(8, 14 + ((v - lo) / span) * 86)}%" class="${i === vals.length - 1 ? 'hi' : ''}"></i>`).join('')}</div>`;
  }
  function sparkBlock(it) {
    const t = histTrend(it);
    if (!t) {
      return `<div style="margin-top:13px;position:relative;border:1px dashed rgba(255,255,255,.28);border-radius:16px;padding:10px 13px;font-size:11px;color:var(--accent-300)">
        No trend yet — ${samples(it).length ? 'one reading stored' : 'no readings stored'}. Trove saves one real reading a day as it keeps prices fresh; the line appears on the second.</div>`;
    }
    const up = t.pct >= 0;
    return `<div style="margin-top:13px;position:relative">${spark(it)}
      <div style="font-size:10.5px;margin-top:6px;color:${up ? 'var(--sage-300)' : 'var(--accent-300)'}">${up ? '+' : ''}${t.pct.toFixed(1)}% over ${t.days} day${t.days === 1 ? '' : 's'} · ${t.n} readings</div></div>`;
  }

  // ---------- the buy / sell flow ----------
  function flowNode(dot, inner) {
    return `<div style="position:relative;margin-bottom:9px">
      <span style="position:absolute;left:-25px;top:18px;width:14px;height:14px;border-radius:999px;background:${dot};box-shadow:0 0 0 4px var(--surface)"></span>
      ${inner}</div>`;
  }
  function flowChart(it) {
    const m = mv(it), mx = maxBuy(it), p = sellPlan(it), sh = ship(it);
    const now = hasAsk(it) ? it.buy : 0;
    const breakEven = Math.round(fees(m) - sh);
    const mode = !now ? 'unknown' : now <= mx ? 'buy' : now <= breakEven ? 'thin' : 'pass';
    const profit = now ? Math.round(p.net - now) : null;
    const box = (bg, bd) => `background:${bg};border:1.5px solid ${bd};border-radius:20px;padding:12px 14px`;
    const line = (a, b, strong) => `<div style="display:flex;align-items:baseline;gap:10px;margin-top:${strong ? 6 : 3}px">
      <span style="flex:1;font-size:11.5px;color:var(--n-700)">${a}</span>
      <b class="disp" style="font-size:${strong ? 19 : 14}px">${b}</b></div>`;

    const verdict = mode === 'buy'
      ? { t: 'Buy \u2014 ' + money(mx - now) + ' under your ceiling', c: 'var(--sage-800)', bg: 'var(--sage-100)', bd: 'var(--sage-300)' }
      : mode === 'thin'
        ? { t: 'Thin \u2014 profitable, but under your ' + targetMargin() + '% target', c: 'var(--accent-800)', bg: 'var(--accent-100)', bd: 'var(--accent-300)' }
        : mode === 'pass'
          ? { t: 'Pass \u2014 ' + money(now - breakEven) + ' past break-even', c: 'var(--accent-900)', bg: 'var(--accent-200)', bd: 'var(--accent-500)' }
          : { t: 'Type what they\u2019re asking to get a buy or pass', c: 'var(--n-800)', bg: 'var(--n-200)', bd: 'var(--n-400)' };

    return `<div style="position:relative;padding-left:25px;margin-top:6px">
      <div style="position:absolute;left:6px;top:14px;bottom:22px;width:2px;background:var(--n-400)"></div>

      ${flowNode('var(--n-700)', `<div style="${box('var(--n-100)', 'var(--n-400)')}">
        <div class="kicker">Market value \u00b7 ${esc(condLabel(it.cond))}</div>
        <div class="disp" style="font-size:26px;margin-top:2px">${money(m)}</div>
        <div class="muted" style="font-size:10.5px">${it.pcMatch ? esc(it.pcMatch) : esc(it.marketSource || 'starter estimate \u2014 updating')}</div>
      </div>`)}

      ${flowNode('var(--accent)', `<div style="${box('var(--surface)', 'var(--accent-300)')}">
        <div class="kicker">Work back to your ceiling</div>
        ${line('Sell at market', money(m))}
        ${line('Marketplace fees', '\u2212 ' + money(p.fee))}
        ${line('Shipping estimate', '\u2212 ' + money(sh))}
        ${line('Your ' + targetMargin() + '% margin', '\u2212 ' + money(Math.round((m * targetMargin()) / 100)))}
        <div style="height:1px;background:var(--divider);margin:9px 0 3px"></div>
        ${line('<b>Pay no more than</b>', money(mx), true)}
      </div>`)}

      ${flowNode(mode === 'buy' ? 'var(--sage-700)' : 'var(--accent-700)', `<div style="${box(verdict.bg, verdict.bd)}">
        <div style="display:flex;align-items:flex-end;gap:12px">
          <div><div class="kicker">They\u2019re asking</div>
            <div class="disp" style="font-size:22px">${now ? money(now) : '\u2014'}</div></div>
          <div style="margin-left:auto;text-align:right;max-width:58%;font-size:11.5px;font-weight:700;color:${verdict.c}">${esc(verdict.t)}</div>
        </div>
      </div>`)}

      ${flowNode('var(--sage-700)', `<div style="${box('var(--sage-100)', 'var(--sage-300)')}">
        <div class="kicker">If you flip it</div>
        ${line('List at', money(p.list))}
        ${line('Fees + shipping', '\u2212 ' + money(p.fee + sh))}
        ${line('You keep', money(p.net))}
        ${now ? line('<b>Profit on this buy</b>', (profit >= 0 ? '' : '\u2212') + money(Math.abs(profit)), true) : ''}
      </div>`)}
    </div>`;
  }

  // ---------- deal hunting ----------
  function dealsBlock(it) {
    const m = mv(it);
    const links = D.dealLinks(it.name, {
      region: it.region || 'en',
      maxBuy: maxBuy(it),
      cibCap: it.tiers && it.tiers.cib ? Math.round(it.tiers.cib * 0.85) : Math.round(m * 0.85),
    });
    return `<div class="card" style="padding:4px 15px">
      ${links.map((l) => `<a class="linkrow" href="${esc(l.url)}" target="_blank" rel="noopener" style="border-top:1px solid var(--divider);align-items:flex-start;padding:11px 0">
        <span style="flex:1">
          <span style="display:block;font-size:12.5px;font-weight:700">${esc(l.name)}</span>
          <span class="muted" style="display:block;font-size:10.5px;margin-top:2px">${esc(l.why)}</span>
        </span>${svg(ICON.out, 14)}
      </a>`).join('')}
    </div>
    <p class="muted" style="font-size:10.5px;margin:8px 2px 0">Each search drops parts / repair / repro / box-only listings, and \u2014 on US searches \u2014 Japanese and PAL copies.</p>`;
  }

  // ---------- haul (whole-pile) mode ----------
  const HAUL_KEY = 'trove.haul.v1';
  let haul = (() => { try { return JSON.parse(localStorage.getItem(HAUL_KEY) || '[]'); } catch (e) { return []; } })();
  const saveHaul = () => { try { localStorage.setItem(HAUL_KEY, JSON.stringify(haul)); } catch (e) {} };
  function haulTotals() {
    const market = haul.reduce((x, h) => x + (h.market || 0), 0);
    const max = haul.reduce((x, h) => x + (h.max || 0), 0);
    const ask = haul.reduce((x, h) => x + (h.ask || 0), 0);
    const net = haul.reduce((x, h) => x + fees(h.market || 0) - ship({ kind: h.kind }), 0);
    return { market, max, ask, net, profit: net - ask };
  }

  // ---------- barcode scanner ----------
  const SCANLOG_KEY = 'trove.scans.v1';
  const scan = { code: null, busy: false, result: null, err: null, kind: null, cond: 'used', engine: null,
    log: (() => { try { return JSON.parse(localStorage.getItem(SCANLOG_KEY) || '[]'); } catch (e) { return []; } })() };
  const saveScans = () => { try { localStorage.setItem(SCANLOG_KEY, JSON.stringify(scan.log.slice(0, 40))); } catch (e) {} };
  let scanVideo = null, scanStream = null, scanTimer = null, scanReader = null, scanStarting = false;
  let scanCanvas = null, scanTicks = 0, scanStatT = null;

  async function loadZX() {
    if (window.ZXing) return window.ZXing;
    await new Promise((res) => {
      const el = document.createElement('script');
      el.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js';
      el.onload = res; el.onerror = res;
      document.head.appendChild(el);
    });
    if (window.ZXing) return window.ZXing;
    return await import('https://esm.sh/@zxing/library@0.21.3');
  }

  async function startScan() {
    if (scanStarting) return;
    scanStarting = true;
    stopScan();
    scan.err = null; scan.engine = 'starting'; render();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      scan.engine = null;
      scan.err = 'This browser can’t open the camera. Type the numbers under the barcode instead.';
      scanStarting = false; return render();
    }
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      });
    } catch (err) {
      scanStream = null; scan.engine = null;
      scan.err = err && err.name === 'NotAllowedError'
        ? 'Camera access is blocked for this site. Allow it in your browser settings, then tap Start camera.'
        : 'No camera available — type the numbers under the barcode.';
      scanStarting = false; return render();
    }
    try {
      const track = scanStream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (err) {}

    scanVideo = document.createElement('video');
    scanVideo.setAttribute('playsinline', '');
    scanVideo.setAttribute('autoplay', '');
    scanVideo.setAttribute('muted', '');
    scanVideo.muted = true;
    scanVideo.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
    scanVideo.srcObject = scanStream;
    try { await scanVideo.play(); } catch (err) {}
    mountScan();

    const FORMATS = ['ean_13', 'upc_a', 'upc_e', 'ean_8', 'code_128', 'code_39', 'itf'];
    let det = null;
    if ('BarcodeDetector' in window) {
      try { det = new window.BarcodeDetector({ formats: FORMATS }); }
      catch (err) { try { det = new window.BarcodeDetector(); } catch (e2) { det = null; } }
    }
    try {
      const ZX = await loadZX();
      const hints = new Map();
      hints.set(ZX.DecodeHintType.TRY_HARDER, true);
      hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, [
        ZX.BarcodeFormat.EAN_13, ZX.BarcodeFormat.UPC_A, ZX.BarcodeFormat.EAN_8,
        ZX.BarcodeFormat.UPC_E, ZX.BarcodeFormat.CODE_128, ZX.BarcodeFormat.CODE_39, ZX.BarcodeFormat.ITF]);
      scanReader = new ZX.BrowserMultiFormatReader(hints, 100);
    } catch (err) { scanReader = null; }

    if (!det && !scanReader) {
      scan.engine = null;
      scan.err = 'The scanner couldn’t start — type the numbers under the barcode.';
      scanStarting = false; return render();
    }
    scan.engine = det && scanReader ? 'both' : det ? 'native' : 'zxing';
    scanTicks = 0;
    scanTimer = setInterval(() => { scanTick(det, scanReader); }, 180);
    clearInterval(scanStatT);
    scanStatT = setInterval(paintScanStat, 900);
    scanStarting = false;
    render();
  }

  let scanBusyTick = false;
  async function scanTick(det, zx) {
    if (scanBusyTick || !scanVideo || !scanStream || scan.busy || scan.code) return;
    const vw = scanVideo.videoWidth, vh = scanVideo.videoHeight;
    if (!vw || !vh) return;
    scanBusyTick = true;
    scanTicks++;
    const crops = (scanTicks % 3 === 0)
      ? [[0, 0, vw, vh, 1]]
      : [[vw * 0.04, vh * 0.22, vw * 0.92, vh * 0.56, 2]];
    try {
      for (const [sx, sy, sw, sh, zoom] of crops) {
        const c = scanCanvas || (scanCanvas = document.createElement('canvas'));
        c.width = Math.round(sw * zoom); c.height = Math.round(sh * zoom);
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(scanVideo, sx, sy, sw, sh, 0, 0, c.width, c.height);
        if (det) {
          try {
            const hits = await det.detect(c);
            if (hits && hits.length) { onCode(hits[0].rawValue); return; }
          } catch (err) {}
        }
        if (zx) {
          try {
            const res = zx.decodeFromCanvas(c);
            if (res) { onCode(res.getText()); return; }
          } catch (err) {}
        }
      }
    } finally { scanBusyTick = false; }
  }

  const scanStatText = () => (scan.engine === 'starting' || !scan.engine
    ? 'Starting the scanner…'
    : 'Scanning (' + scan.engine + ', ' + scanTicks + ' looks) — fill the frame, 4–6 in away');
  function paintScanStat() {
    const el = $('scanStat');
    if (el) el.textContent = scanStatText();
    else { clearInterval(scanStatT); scanStatT = null; }
  }

  function stopScan() {
    clearInterval(scanTimer); scanTimer = null;
    clearInterval(scanStatT); scanStatT = null;
    scanBusyTick = false;
    scan.engine = null;
    if (scanReader) { try { scanReader.reset(); } catch (err) {} scanReader = null; }
    if (scanStream) { scanStream.getTracks().forEach((t) => { try { t.stop(); } catch (e) {} }); scanStream = null; }
    if (scanVideo) {
      try { scanVideo.pause(); } catch (err) {}
      scanVideo.srcObject = null;
      if (scanVideo.parentNode) scanVideo.parentNode.removeChild(scanVideo);
      scanVideo = null;
    }
  }

  function mountScan() {
    const host = $('scanView');
    if (host && scanVideo && scanVideo.parentNode !== host) host.insertBefore(scanVideo, host.firstChild);
  }

  function onCode(code) {
    code = String(code || '').replace(/\D/g, '');
    if (!code || scan.busy || code === scan.code) return;
    scan.code = code; scan.result = null; scan.err = null;
    if (navigator.vibrate) navigator.vibrate(30);
    render();
  }

  async function priceCode() {
    if (!scan.code || !scan.kind) return;
    scan.busy = true; scan.err = null; render();
    try {
      const r = await S.quickLook(scan.code, scan.cond, 'en', scan.kind);
      r.code = scan.code;
      scan.result = r;
      const name = (r.market && r.market.title) || r.query;
      scan.log = [{ code: scan.code, name, market: Math.round(r.soldMedian || 0), image: r.image || null,
        kind: scan.kind, cond: scan.cond, t: Date.now() }].concat(scan.log.filter((x) => x.code !== scan.code)).slice(0, 40);
      saveScans();
    } catch (err) { scan.err = err.message; }
    scan.busy = false;
    render();
  }

  // Turn a lookup result into a tracked item. No made-up asking price: if there
  // isn't a live one, the item simply has none until there is.
  function trackResult(r, kind, cond, region, platform) {
    const id = uid();
    const sell = Math.round(r.soldMedian || 0);
    const ask = Math.round(r.lowestBuy || 0);
    const plat = platform || 'multi';
    const now = Date.now();
    S.update((st2) => {
      st2.items.unshift({ id, name: (r.market && r.market.title) || r.query, kind: kind || 'game',
        platform: plat, era: D.CURRENT_PLATFORMS.includes(plat) ? 'current' : 'retro',
        cond: cond || 'used', region: region || 'en',
        buy: ask, askAt: ask ? now : 0, askSrc: ask ? 'ebay' : null, sell, tiers: r.tiers || null,
        autoImage: r.image || null, pcUrl: r.pcUrl || (r.market && r.market.url) || null, marketSource: 'PriceCharting',
        pcMatch: r.market ? r.market.title + (r.market.console ? ' · ' + r.market.console : '') : null,
        listings: r.listings || [], bestUrl: (r.listings || [])[0] && r.listings[0].url,
        upc: r.code || null, refreshedAt: r.stale ? (r.cachedAt || now) : now,
        history: sell ? [{ t: now, buy: ask, sell }] : [] });
    });
    return id;
  }

  // ---------- artwork ----------
  function art(it, size, radius) {
    const [label, bg, fg] = platOf(it);
    const r = radius || Math.round(size * 0.22);
    const photo = it.image || it.autoImage;
    if (photo) {
      return `<div class="art" style="width:${size}px;height:${size}px;border-radius:${r}px;background:#fff">
        <img src="${esc(photo)}" alt="${esc(it.name)}" loading="lazy" style="object-fit:contain;padding:${Math.round(size * 0.06)}px">
      </div>`;
    }
    const shape = it.kind === 'game'
      ? '<span class="dev"></span><span class="cartnotch"></span>'
      : it.kind === 'console'
        ? '<span class="dev"></span><span class="disc"></span>'
        : it.kind === 'accessory'
          ? '<span class="dev" style="inset:26% 14%"></span>'
          : '<span class="dev"></span><span class="dev-screen"></span><span class="dev-dot" style="left:22%"></span><span class="dev-dot" style="right:22%"></span>';
    return `<div class="art" style="width:${size}px;height:${size}px;border-radius:${r}px;background:linear-gradient(155deg,${bg},${bg} 55%,rgba(0,0,0,.22))">
      ${shape}
      <div class="lab" style="position:relative;color:${fg};font-size:${Math.max(8, Math.round(size * (label.length > 7 ? 0.13 : 0.16)))}px;text-shadow:0 1px 2px rgba(0,0,0,.3)">${esc(label)}</div>
    </div>`;
  }

  // ---------- links ----------
  const buyUrl = (it) => it.bestUrl || D.dealLinks(it.name, { region: it.region || 'en', maxBuy: maxBuy(it) })[0].url;
  const buyLabel = (it) => (it.bestUrl && hasAsk(it) ? 'Buy ' + money(it.bestPrice || it.buy) : 'Hunt one under ' + money(maxBuy(it)));

  // ---------- filtering ----------
  function catalog() {
    const s = st();
    const q = ui.q.trim().toLowerCase();
    let list = (s.items || []).map((i) => Object.assign({ platform: 'multi', era: 'current' }, i));
    if (q) list = list.filter((i) => (i.name + ' ' + platOf(i)[0] + ' ' + i.kind).toLowerCase().includes(q));
    if (ui.plat !== 'all') list = list.filter((i) => i.platform === ui.plat);
    if (ui.kind !== 'all') list = list.filter((i) => i.kind === ui.kind);
    if (ui.era !== 'all') list = list.filter((i) => i.era === ui.era);
    if (ui.region !== 'all') list = list.filter((i) => (i.region || 'en') === ui.region);
    const price = (i) => (hasAsk(i) ? i.buy : mv(i));
    const by = {
      steal: (a, b) => gap(b) - gap(a) || (b.refreshedAt || 0) - (a.refreshedAt || 0),
      cheap: (a, b) => price(a) - price(b),
      value: (a, b) => mv(b) - mv(a),
      az: (a, b) => a.name.localeCompare(b.name),
    }[ui.sort];
    return list.sort(by);
  }

  const platformsInUse = () => {
    const seen = [];
    (st().items || []).forEach((i) => { const p = i.platform || 'multi'; if (!seen.includes(p)) seen.push(p); });
    return seen.sort((a, b) => (D.PLATFORMS[a] || ['z'])[0].localeCompare((D.PLATFORMS[b] || ['z'])[0]));
  };

  // ---------- rows ----------
  function itemRow(it) {
    const g = grade(it);
    const f = freshness(it);
    const ask = hasAsk(it);
    return `<button class="row" data-open="${it.id}">
      ${art(it, 54)}
      <div style="flex:1;min-width:0">
        <div class="ellip" style="font-size:13.5px;font-weight:700">${esc(it.name)}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:4px;min-width:0">
          <span class="tag tag-plat" style="background:${platOf(it)[1]};color:${platOf(it)[2]};flex:none">${esc(platOf(it)[0])}</span>
          <span class="muted ellip" style="font-size:10.5px">${esc(condLabel(it.cond))} · ${fdot(f)}${esc(f.label)}</span>
        </div>
      </div>
      <div style="flex:none;text-align:right">
        <div class="disp" style="font-size:18px">${money(ask ? it.buy : mv(it))}</div>
        ${ask ? `<div class="stamp ${g.cls}" style="margin-top:5px;font-size:9.5px;padding:3px 8px">${esc(g.label)}</div>`
          : `<div class="muted" style="font-size:10px;margin-top:4px">market value</div>`}
      </div>
    </button>`;
  }

  // ---------- keeping prices fresh ----------
  let lastAuto = 0;
  async function runRefresh(opts, quiet) {
    if (ui.refresh) return;
    const o = opts || {};
    const due = o.all ? st().items.length : Math.min(S.staleItems().length, o.limit || 1e9);
    if (!due) { if (!quiet) toast('Every price is already fresh'); return; }
    ui.refresh = { done: 0, total: due };
    paintRefreshBar();
    try {
      const n = await S.refreshStale(o, (done, total) => { ui.refresh = { done, total }; paintRefreshBar(); });
      if (!quiet) toast(n ? 'Updated ' + n + ' price' + (n > 1 ? 's' : '') : 'Couldn’t reach the price source — try again shortly');
    } catch (err) { if (!quiet) toast(err.message); }
    ui.refresh = null;
    renderBg();
  }
  // Quietly bring out-of-date prices current: on launch, when the app comes back
  // to the foreground, and every 15 minutes while it's open. Watched items first.
  function autoRefresh() {
    if (st().settings.autoRefresh === false || document.hidden || navigator.onLine === false) return;
    if (Date.now() - lastAuto < 10 * 60e3) return;
    lastAuto = Date.now();
    runRefresh({ limit: 12 }, true);
  }

  function refreshBarHtml() {
    const r = ui.refresh;
    if (r) {
      const pct = r.total ? Math.round((r.done / r.total) * 100) : 8;
      return `<div style="background:var(--sage-100);border-radius:20px;padding:11px 14px">
        <div style="display:flex;align-items:center;gap:9px">
          <span class="spin" style="color:var(--sage-700);display:grid;place-items:center">${svg(ICON.refresh, 17)}</span>
          <span style="flex:1;font-size:12px;font-weight:700;color:var(--sage-800)">Updating prices — ${r.done} of ${r.total || '…'}</span>
          <span class="disp" style="font-size:13px;color:var(--sage-800)">${pct}%</span>
        </div>
        <div class="bar" style="margin-top:9px;background:var(--sage-200)"><i style="width:${Math.max(4, pct)}%;background:var(--sage-700);transition:width .3s ease"></i></div>
      </div>`;
    }
    const stale = S.staleItems().length;
    const bg = stale ? 'var(--accent-100)' : 'var(--sage-100)';
    const fg = stale ? 'var(--accent-800)' : 'var(--sage-800)';
    const txt = stale
      ? stale + ' price' + (stale > 1 ? 's' : '') + ' out of date — tap to update now'
      : 'All prices fresh · checked ' + lastCheckedText() + ' · tap to re-check';
    return `<button class="row" data-refreshall="1" style="min-height:0;padding:9px 13px;background:${bg};box-shadow:none">
        <span style="color:${fg};display:grid;place-items:center">${svg(ICON.refresh, 17)}</span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-size:12px;font-weight:700;color:${fg}">${esc(txt)}</span>
          ${S.priceError ? `<span class="muted" style="display:block;font-size:10.5px">eBay asks unavailable (${esc(S.priceError)}) — market values still live</span>` : ''}
        </span>
      </button>`;
  }
  function lastCheckedText() {
    const ts = (st().items || []).map((i) => i.refreshedAt || 0).filter(Boolean);
    return ts.length ? ago(Math.max.apply(null, ts)) : 'never';
  }
  function paintRefreshBar() {
    const el = $('refreshBar');
    if (el) el.innerHTML = refreshBarHtml();
  }

  // ---------- live search ----------
  // The search box does two jobs at once: filters what you track, and — after a
  // short pause in typing — pulls the live market price for whatever you typed.
  const live = { q: '', busy: false, r: null, err: null, args: '' };
  let liveSeq = 0, liveT = null;
  const liveArgs = () => ({
    region: ui.region === 'all' ? 'en' : ui.region,
    kind: ui.kind === 'all' ? null : ui.kind,
    platform: ui.plat === 'all' ? null : ui.plat,
  });
  function scheduleLive() {
    clearTimeout(liveT);
    const q = ui.q.trim();
    if (q.length < 3) {
      liveSeq++;
      Object.assign(live, { q: '', busy: false, r: null, err: null, args: '' });
      return paintLive();
    }
    liveT = setTimeout(runLive, 550);
  }
  async function runLive() {
    const q = ui.q.trim();
    if (q.length < 3) return;
    const a = liveArgs(), sig = JSON.stringify(a);
    if (live.q === q && live.args === sig && live.r && !live.busy && !live.r.stale) return;
    const seq = ++liveSeq;
    const peek = S.peekMarket(q, a.region, a.kind, a.platform);
    Object.assign(live, { q, busy: true, err: null, r: peek, args: sig });
    if (peek && !peek.stale) { live.busy = false; return paintLive(); }
    paintLive();
    try {
      const r = await S.marketLookup(q, a.region, a.kind, a.platform);
      if (seq !== liveSeq) return;
      live.r = r;
    } catch (err) {
      if (seq !== liveSeq) return;
      live.err = err.message;
    }
    live.busy = false;
    paintLive();
  }

  // ---------- detail ----------
  function detailSheet() {

    const g = grade(it);
    const w = (st().watch || {})[it.id];
    const listings = hasAsk(it) ? (it.listings || []) : [];
    const [plabel, pbg, pfg] = platOf(it);
    const f = freshness(it);
    const busy = ui.detailBusy === it.id;
    return sheet(`
      <div style="display:flex;align-items:center;gap:13px">
        ${art(it, 74, 20)}
        <div style="min-width:0;flex:1">
          <div class="disp" style="font-size:20px">${esc(it.name)}</div>
          <div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap">
            <span class="tag tag-plat" style="background:${pbg};color:${pfg}">${esc(plabel)}</span>
            <span class="tag">${esc(condLabel(it.cond))}</span>
            <span class="tag ${it.era === 'retro' ? 'tag-sage' : 'tag-accent'}">${it.era === 'retro' ? 'Retro' : 'Current'}</span>
            <span class="tag">${esc(regionOf(it))}</span>
          </div>
        </div>
      </div>
      ${(() => {
        const nt = it.matchNote || {};
        const warn = nt.platformMiss ? 'No ' + platOf(it)[0] + ' release matched — this price is the closest other platform. Fix the platform and refresh.'

            : null;
        return `${it.pcMatch ? `<div class="muted" style="font-size:11px;margin-top:9px">Priced as <b>${esc(it.pcMatch)}</b>${nt.droppedRegion ? ' · ' + nt.droppedRegion + ' foreign listing' + (nt.droppedRegion === 1 ? '' : 's') + ' ignored' : ''}</div>` : ''}
        ${warn ? `<div style="margin-top:10px;border:1.5px solid var(--accent-500);background:var(--accent-100);border-radius:20px;padding:11px 14px;font-size:11.5px;font-weight:600;color:var(--accent-900)">${esc(warn)}</div>` : ''}`;
      })()}

      <div class="cab" style="margin-top:14px">
        <span class="scan"></span>
        <div style="display:flex;align-items:flex-end;gap:16px;position:relative">

            <div class="kicker">Market value</div>

          <div style="margin-left:auto;text-align:right">

          </div>
        </div>
        ${sparkBlock(it)}
        ${it.tiers ? `<div style="display:flex;gap:8px;margin-top:13px;position:relative">
          <div class="stat"><b>${money(it.tiers.loose)}</b><span>Loose</span></div>
          <div class="stat"><b>${money(it.tiers.cib)}</b><span>CIB</span></div>
          <div class="stat"><b>${money(it.tiers.sealed)}</b><span>Sealed</span></div>
        </div>` : ''}

            <div class="disp" style="font-size:24px;margin-top:3px">${money(maxBuy(it))}</div>
          </div>
          <div style="text-align:right;font-size:10.5px;color:var(--accent-300);max-width:44%">to clear ${targetMargin()}% after fees and ${money(ship(it))} shipping</div>
        </div>
      </div>

      <h4 style="margin:20px 0 4px">Buy or pass</h4>

      ${(() => { const p = sellPlan(it); return `<div class="cab cab-sage" style="margin-top:12px">

          ? (p.t.pct > 4 ? 'Up ' + p.t.pct.toFixed(1) + '% across ' + p.t.n + ' readings — holding has paid'
            : p.t.pct < -4 ? 'Down ' + Math.abs(p.t.pct).toFixed(1) + '% across ' + p.t.n + ' readings — list it'
              : 'Flat across ' + p.t.n + ' readings')
          : 'A measured trend appears here once Trove has stored a few days of readings — nothing is guessed.'}</div>
        <div style="display:flex;gap:9px;margin-top:12px;position:relative">

        <a class="btn btn-secondary" href="${esc(it.pcUrl || D.priceCharting(it.name))}" target="_blank" rel="noopener" style="flex:1;font-size:12.5px">Price history ${svg(ICON.out, 13)}</a>

      ${listings.length ? `<h4 style="margin:22px 0 8px">Cheapest right now</h4>
